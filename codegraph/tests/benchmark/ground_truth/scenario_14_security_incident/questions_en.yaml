scenario:
  id: scenario_14_security_incident
  name: Security Incident Response
  mapped_workflow: security_incident_workflow
  graph_methods:
  - trace_vulnerability_impact
  - find_affected_paths
  - analyze_exploit_chain

metadata:
  version: '2.0'
  language: en
  question_count: 10
  difficulty_distribution:
    easy: 2
    medium: 5
    hard: 3

questions:
  - id: SEC_INC_EN_001
    question: "Trace data flow from user input to SQL execution"
    category: vulnerability_trace
    difficulty: medium
    postgresql_subsystem: backend
    ground_truth:
      expected_functions:
        - pq_getmsgstring
        - exec_simple_query
        - pg_parse_query
      key_patterns:
        - input
        - query
        - parse
        - execute
      required_keywords:
        - input
        - sql
        - query
      min_expected_count: 1
    evaluation:
      metrics: [precision_at_k, recall_at_k, mrr, keyword_coverage]
      semantic_similarity_threshold: 0.7

  - id: SEC_INC_EN_002
    question: "Find all paths from network input to file access"
    category: attack_path
    difficulty: hard
    postgresql_subsystem: backend
    ground_truth:
