scenario:
  id: scenario_09_code_review
  name: Code Review Assistance
  mapped_workflow: code_review_workflow
  graph_methods:
  - analyze_change_impact
  - find_breaking_changes
  - review_patch

metadata:
  version: '2.0'
  language: en
  question_count: 10
  difficulty_distribution:
    easy: 3
    medium: 5
    hard: 2

questions:
  - id: REV_EN_001
    question: "What functions call heap_insert and might be affected by changes?"
    category: change_impact
    difficulty: easy
    postgresql_subsystem: storage/heap
    ground_truth:
      expected_functions:
        - heap_insert
        - heapam_tuple_insert
        - table_tuple_insert
      key_patterns:
        - heap_insert
        - caller
        - affected
        - tuple
      required_keywords:
        - heap
        - insert
        - call
      min_expected_count: 1
    evaluation:
      metrics: [precision_at_k, recall_at_k, mrr, keyword_coverage]
      semantic_similarity_threshold: 0.7

  - id: REV_EN_002
    question: "Find all callers of LWLockAcquire for lock change review"
    category: change_impact
    difficulty: medium
    postgresql_subsystem: lock_manager
    ground_truth:
      expected_functions:
        - LWLockAcquire
        - LWLockConditionalAcquire
        - LWLockAcquireOrWait
      key_patterns:
        - LWLock
        - Acquire
