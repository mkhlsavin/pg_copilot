scenario:
  id: scenario_10_cross_repo
  name: Cross-Repository Impact
  mapped_workflow: cross_repo_workflow
  graph_methods:
  - find_api_dependencies
  - analyze_extension_impact
  - find_external_callers

metadata:
  version: '2.0'
  language: en
  question_count: 10
  difficulty_distribution:
    easy: 3
    medium: 5
    hard: 2

questions:
  - id: CROSS_EN_001
    question: "Which extensions depend on palloc function?"
    category: extension_dependencies
    difficulty: easy
    postgresql_subsystem: memory
    ground_truth:
      expected_functions:
        - palloc
        - palloc0
        - MemoryContextAlloc
      key_patterns:
        - palloc
        - extension
        - depend
        - memory
      required_keywords:
        - palloc
        - extension
      min_expected_count: 1
    evaluation:
      metrics: [precision_at_k, recall_at_k, mrr, keyword_coverage]
      semantic_similarity_threshold: 0.7

  - id: CROSS_EN_002
    question: "Find external API functions used by extensions"
    category: api_usage
    difficulty: medium
    postgresql_subsystem: general
    ground_truth:
      expected_functions:
        - PG_FUNCTION_INFO_V1
        - PG_GETARG_DATUM
        - PG_RETURN_DATUM
      key_patterns:
        - PG_FUNCTION
        - extension
        - API
        - external
      required_keywords:
        - function
        - extension
        - api
      min_expected_count: 1
    evaluation:
      metrics: [precision_at_k, recall_at_k, mrr, keyword_coverage]
      semantic_similarity_threshold: 0.7

