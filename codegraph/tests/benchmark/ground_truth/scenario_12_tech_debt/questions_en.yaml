scenario:
  id: scenario_12_tech_debt
  name: Technical Debt Quantification
  mapped_workflow: tech_debt_workflow
  graph_methods:
  - find_todo_comments
  - find_fixme_comments
  - find_legacy_patterns

metadata:
  version: '2.0'
  language: en
  question_count: 10
  difficulty_distribution:
    easy: 4
    medium: 4
    hard: 2

questions:
  - id: DEBT_EN_001
    question: "Find all TODO comments in the codebase"
    category: todo_tracking
    difficulty: easy
    postgresql_subsystem: general
    ground_truth:
      expected_functions: []
      key_patterns:
        - TODO
        - todo
        - comment
      required_keywords:
        - todo
      min_expected_count: 0
    evaluation:
      metrics: [precision_at_k, recall_at_k, mrr, keyword_coverage]
      semantic_similarity_threshold: 0.7

  - id: DEBT_EN_002
    question: "Find FIXME comments that need attention"
    category: fixme_tracking
    difficulty: easy
    postgresql_subsystem: general
    ground_truth:
      expected_functions: []
      key_patterns:
        - FIXME
        - fixme
        - fix
        - comment
      required_keywords:
        - fixme
        - fix
      min_expected_count: 0
    evaluation:
      metrics: [precision_at_k, recall_at_k, mrr, keyword_coverage]
      semantic_similarity_threshold: 0.7

  - id: DEBT_EN_003
    question: "Find XXX comments indicating problematic code"
    category: xxx_tracking
    difficulty: easy
    postgresql_subsystem: general
