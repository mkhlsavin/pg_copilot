scenario:
  id: scenario_15_debugging
  name: Debugging Support
  mapped_workflow: debugging_workflow
  graph_methods:
  - find_debug_points
  - trace_execution
  - find_logging_points

metadata:
  version: '2.0'
  language: en
  question_count: 15
  difficulty_distribution:
    easy: 5
    medium: 6
    hard: 4

questions:
  - id: DBG_EN_001
    question: "Where should I set breakpoints for debugging query execution?"
    category: debug_points
    difficulty: easy
    postgresql_subsystem: executor
    ground_truth:
      expected_functions:
        - ExecutorRun
        - ExecProcNode
        - standard_ExecutorRun
      key_patterns:
        - ExecutorRun
        - ExecProcNode
        - executor
      required_keywords:
        - executor
        - run
        - node
      min_expected_count: 1
    evaluation:
      metrics: [precision_at_k, recall_at_k, mrr, keyword_coverage]
      semantic_similarity_threshold: 0.7

  - id: DBG_EN_002
