scenario:
  id: scenario_01_onboarding
  name: Codebase Onboarding
  mapped_workflow: onboarding_workflow
  graph_methods:
  - find_definition
  - find_all_references
  - trace_callers
  - trace_callees
  - trace_data_flow
  - explain_subsystem
  - find_breakpoints
metadata:
  version: '2.0'
  language: en
  question_count: 190
  difficulty_distribution:
    easy: 58
    medium: 80
    hard: 52
  consolidated_from:
  - scenario_01_definition_search
  - scenario_02_call_graph
  - scenario_03_data_flow
  - scenario_13_subsystem
  - scenario_14_debugging
  - scenario_16_business_logic
questions:
