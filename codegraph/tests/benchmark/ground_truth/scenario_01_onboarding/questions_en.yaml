    retrieval_type: definition
    search_pattern: heap_insert
  ground_truth:
    expected_functions:
    - heap_insert
    key_patterns:
    - heap_insert
    - heapam.c
    - storage
    required_keywords:
    - heap
    - insert
    - tuple
    - relation
    min_expected_count: 1
  evaluation:
    metrics:
    - precision_at_k
    - recall_at_k
    - mrr
    - keyword_coverage
    semantic_similarity_threshold: 0.7
