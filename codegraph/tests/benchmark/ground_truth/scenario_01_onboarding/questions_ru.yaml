  category: error_data_flow
  difficulty: hard
  ground_truth:
    expected_functions:
    - ereport
    - errdetail
    - errmsg
    key_patterns:
    - ereport
    - err.*
    required_keywords:
    - ошибка
    - сообщение
    - распространение
    - данные
    min_expected_count: 3
- id: DF_RU_030
  question: Найдите все источники недетерминизма влияющие на результаты запросов
  category: nondeterminism_sources
  difficulty: hard
  ground_truth:
    expected_functions:
    - random
    - now
    - current_timestamp
    key_patterns:
    - random
    - timestamp
    - now
    required_keywords:
    - недетерминизм
    - случайный
    - время
    min_expected_count: 2
