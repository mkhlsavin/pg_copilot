scenario:
  id: scenario_01_onboarding
  name: Codebase Onboarding
  mapped_workflow: onboarding_workflow
  graph_methods:
  - find_definition
  - find_all_references
  - trace_callers
  - trace_callees
  - trace_data_flow
  - explain_subsystem
  - find_breakpoints
