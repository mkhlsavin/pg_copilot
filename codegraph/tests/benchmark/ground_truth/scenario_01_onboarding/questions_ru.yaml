  version: '2.0'
  language: ru
  question_count: 100
  difficulty_distribution:
    easy: 30
    medium: 42
    hard: 28
  consolidated_from:
  - scenario_01_definition_search
  - scenario_02_call_graph
  - scenario_03_data_flow
  - scenario_13_subsystem
  - scenario_14_debugging
  - scenario_16_business_logic
