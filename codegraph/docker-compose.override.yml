# This file is automatically loaded with docker-compose.yml
# DO NOT use in production!
# =============================================================================

version: '3.8'

services:
  api:
    build:
      target: production
    environment:
      - ENVIRONMENT=development
      - API_DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src:ro
      - ./config.yaml:/app/config.yaml:ro
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    # Remove resource limits for development
    deploy:
      resources:
        limits:
          cpus: '0'
          memory: '0'

  postgres:
    ports:
      # Expose PostgreSQL for local development tools (DBeaver, pgAdmin, etc.)
      - "5432:5432"
