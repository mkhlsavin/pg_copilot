# =============================================================================
# Grafana Datasource Provisioning
# This file configures datasources automatically on Grafana startup
# =============================================================================

apiVersion: 1

datasources:
  # ========================================================================
  # Prometheus - Primary metrics datasource
  # ========================================================================
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "10s"
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: "2.48.0"
    version: 1

  # ========================================================================
  # PostgreSQL - Direct database queries (optional)
  # ========================================================================
