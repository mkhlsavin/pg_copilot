# =============================================================================
# Prometheus Configuration for CodeGraph
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    service: 'codegraph'

# Alertmanager configuration (optional - uncomment if using alertmanager)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Rule files (optional - uncomment if using alerting rules)
# rule_files:
#   - '/etc/prometheus/rules/*.yml'

# Scrape configurations
scrape_configs:
  # ========================================================================
  # Prometheus self-monitoring
  # ========================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # ========================================================================
  # CodeGraph API metrics
  # ========================================================================
  - job_name: 'codegraph-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: /api/v1/metrics
    scrape_interval: 10s
    scrape_timeout: 10s
    honor_labels: true
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'codegraph-api'

  # ========================================================================
  # PostgreSQL metrics (optional - requires postgres_exporter sidecar)
  # ========================================================================
  # - job_name: 'postgresql'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: instance
  #       replacement: 'codegraph-postgres'

  # ========================================================================
  # Node metrics (optional - for host machine monitoring)
  # Requires node_exporter running on host
  # ========================================================================
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['host.docker.internal:9100']
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: instance
  #       replacement: 'codegraph-host'
