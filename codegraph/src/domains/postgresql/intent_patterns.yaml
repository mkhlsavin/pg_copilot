  feature_development:
    keywords:
      - implement
      - add feature
      - create
      - build
      - develop
      - where to add
      - how to extend
      - integration point
      - hook
      - where should
      - add
    examples:
      - "Where should I add a new join algorithm?"
      - "How to implement custom index type?"
      - "Find extension points for query optimizer"
    priority: 7
    domain_specific:
      - custom scan providers
      - FDW implementation
      - custom index AM
      - hook points
