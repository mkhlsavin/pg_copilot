# PostgreSQL-specific Intent Patterns
# Extends base intent patterns with PostgreSQL-specific keywords and examples

intents:
  onboarding:
    keywords:
      - onboard
      - overview
      - introduction
      - getting started
      - explain codebase
      - architecture overview
      - how does it work
      - subsystem
      - module structure
      - main components
      - where is
      - defined
      - definition
      - find function
      - locate
      - signature
      - which file
      - call
      - caller
      - callee
      - calls
      - called by
      - who calls
      - what calls
      - functions call
      - trace
      - dataflow
      - data flow
      - variable
      - assigned
      - used by
      - flows to
    examples:
      - "Give me an overview of the PostgreSQL codebase"
      - "What are the main subsystems?"
      - "Explain how the executor works"
      - "Where is the function heap_insert defined?"
      - "Which functions call heap_insert?"
      - "Trace the variable slot in ExecScan"
    priority: 5
    domain_specific:
      - PostgreSQL executor
      - query planner
      - heap access
      - WAL logging
      - MVCC

  security_audit:
    keywords:
      - security
      - vulnerability
      - vulnerabilities
      - exploit
      - cve
      - sql injection
      - buffer overflow
      - privilege escalation
      - unsafe
      - taint
      - sanitize
      - validate input
      - untrusted
      - handle input
      - sprintf
      - strcpy
      - strcat
      - gets
      - scanf
      - bounds
      - bounds checking
      - unbounded
      - memory corruption
      - heap overflow
      - stack overflow
      - use after free
      - double free
      - null pointer
      - password
      - credential
      - plaintext
      - authentication
      - injection
      - overflow
      - TOCTOU
      - race condition
      - path traversal
      - sensitive information
      - info leak
      - error message
      - leak
      - deserialization
      - integer overflow
      - dynamic query
      - potential
      - entry point
      - attack surface
      - network-facing
      - external entry
      - client input
      - PG_FUNCTION_INFO
      - exposed
      - exposure
      - trust boundary
      - lateral movement
      - exfiltration
      - bypass
      - authentication entry
    examples:
      - "Find all SQL injection vulnerabilities"
      - "Which functions handle untrusted input?"
      - "Show me buffer overflow risks"
      - "Find functions handling passwords in plaintext"
      - "Find potential path traversal vulnerabilities"
      - "List network-facing functions that handle client input"
      - "Find all external entry points"
    priority: 10
    domain_specific:
      - SPI_execute vulnerabilities
      - pg_has_role bypass
      - superuser escalation
      - extension loading attacks
      - COPY command injection

  performance:
    keywords:
      - performance
      - optimize
      - slow
      - bottleneck
      - hotspot
      - profiling
      - cache
      - memory leak
      - allocate
      - cpu intensive
      - allocation
      - memory
      - cyclomatic
      - complexity
      - in-degree
      - out-degree
      - pagerank
      - betweenness
      - centrality
      - closeness
      - nesting depth
      - cognitive complexity
      - most called
      - high complexity
      - performance analysis
      - scaling
    examples:
      - "Find performance hotspots in the executor"
      - "Which functions allocate the most memory?"
      - "Optimize query planning performance"
      - "Find functions with highest cyclomatic complexity"
      - "What are the most called functions (highest in-degree)?"
      - "Find performance hotspots using PageRank analysis"
    priority: 8
    domain_specific:
      - palloc hotspots
      - shared buffer contention
      - lock waiting
      - index scan performance

  refactoring:
    keywords:
      - refactor
      - clean up
      - simplify
      - improve
      - code smell
      - duplicate
      - complexity
      - technical debt
      - long function
      - god class
      - complex
      - too complex
      - dead code
      - deprecated
      - never called
      - unused
      - obsolete
      - unreachable
      - static function
      - "#if 0"
      - disabled code
      - clone
      - copy-paste
      - copy-pasted
      - copied code
      - similar code
      - identical code
      - duplicate function
      - similar pattern
      - code duplication
      - merge
      - extract
    examples:
      - "Find duplicate code in the planner"
      - "Which functions are too complex?"
      - "Suggest refactoring for parse_relation.c"
