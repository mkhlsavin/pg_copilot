# PostgreSQL Subsystems Configuration
# Defines the major components of PostgreSQL codebase for analysis

subsystems:
  executor:
    description: "Query execution engine - executes query plans"
    patterns:
      - "backend/executor"
      - "execMain"
      - "execProc"
      - "execScan"
      - "nodeSeqscan"
      - "nodeHashjoin"
    keywords:
      - execute
      - scan
      - join
      - sort
      - aggregate
      - plan
      - tuple
    key_functions:
      - ExecProcNode
      - ExecInitNode
      - ExecEndNode
      - ExecScan
      - ExecSeqScan
      - ExecIndexScan
      - ExecHashJoin
      - ExecMergeJoin
      - ExecSort
      - ExecAgg

  parser:
    description: "SQL parser and analyzer - converts SQL to parse tree"
    patterns:
      - "backend/parser"
      - "gram.y"
      - "scan.l"
      - "parse_"
      - "analyze"
    keywords:
      - parse
      - syntax
      - token
      - grammar
      - analyze
      - transform
    key_functions:
      - raw_parser
      - pg_parse_query
      - transformStmt
      - parse_analyze
      - transformSelectStmt
      - transformInsertStmt

  optimizer:
    description: "Query optimizer/planner - generates query plans"
    patterns:
      - "backend/optimizer"
      - "planner"
      - "path"
      - "cost"
      - "joinpath"
      - "relnode"
    keywords:
      - optimize
      - plan
      - cost
      - path
      - join
      - index
      - statistics
    key_functions:
      - standard_planner
      - subquery_planner
      - query_planner
      - set_base_rel_sizes
      - make_rel_from_joinlist
      - create_plan
      - cost_seqscan
      - cost_index

  storage:
    description: "Storage manager - handles file and buffer I/O"
    patterns:
      - "backend/storage"
      - "smgr"
      - "bufmgr"
      - "fd.c"
      - "freespace"
    keywords:
      - storage
      - buffer
      - file
      - page
      - block
      - write
      - read
      - disk
    key_functions:
      - BufferAlloc
      - ReadBuffer
      - WriteBuffer
      - FlushBuffer
      - smgrread
      - smgrwrite
      - FileRead
      - FileWrite

  access:
    description: "Access methods - heap tables and index implementations"
    patterns:
      - "backend/access"
      - "heap"
      - "index"
      - "nbtree"
      - "hash"
      - "gist"
      - "gin"
      - "brin"
    keywords:
      - heap
      - index
      - btree
      - hash
      - scan
      - insert
      - delete
      - tuple
    key_functions:
      - heap_insert
      - heap_update
      - heap_delete
      - heap_fetch
      - heap_getnext
      - index_insert
      - index_getnext
      - btree_insert

  catalog:
    description: "System catalogs - metadata about database objects"
    patterns:
      - "backend/catalog"
      - "pg_class"
      - "pg_attribute"
      - "pg_index"
      - "syscache"
    keywords:
      - catalog
      - system
      - metadata
      - schema
      - type
      - namespace
    key_functions:
      - SearchSysCache
      - GetSysCacheOid
      - heap_open
      - relation_open
      - RelationIdGetRelation
      - CatalogTupleInsert

  commands:
    description: "SQL commands - DDL and utility command implementations"
    patterns:
      - "backend/commands"
      - "tablecmds"
      - "indexcmds"
      - "vacuum"
      - "cluster"
    keywords:
      - create
      - alter
      - drop
      - vacuum
      - analyze
      - reindex
      - cluster
    key_functions:
      - ProcessUtility
      - standard_ProcessUtility
      - DefineRelation
      - AlterTable
      - DropRelation
      - vacuum
      - DefineIndex

  utils:
    description: "Utilities - memory management, error handling, function manager"
    patterns:
      - "backend/utils"
      - "memutils"
      - "palloc"
      - "elog"
      - "fmgr"
    keywords:
      - memory
      - alloc
      - error
      - log
      - cache
      - hash
      - list
    key_functions:
      - palloc
      - pfree
      - repalloc
      - MemoryContextAlloc
      - elog
      - ereport
      - fmgr_info
      - DirectFunctionCall

  replication:
    description: "Replication - WAL shipping and logical replication"
    patterns:
      - "backend/replication"
      - "walsender"
      - "walreceiver"
      - "logical"
    keywords:
      - replication
      - wal
      - standby
      - sync
      - logical
      - slot
    key_functions:
      - WalSndLoop
      - WalReceiverMain
      - CreateReplicationSlot
      - XLogSendPhysical
      - logicalrep_write

  transactions:
    description: "Transaction management - ACID properties and WAL"
    patterns:
      - "backend/access/transam"
      - "xact"
      - "xlog"
      - "clog"
      - "multixact"
    keywords:
      - transaction
      - commit
      - rollback
      - xid
      - snapshot
      - mvcc
    key_functions:
      - StartTransaction
      - CommitTransaction
      - AbortTransaction
      - GetCurrentTransactionId
      - XLogInsert
      - XLogFlush
