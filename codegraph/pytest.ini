[pytest]
# Only collect tests from tests/ directory
testpaths = tests

# Standard test file patterns (but not from src/)
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Ignore src/ directory for test collection
norecursedirs = src examples .git __pycache__ .pytest_cache venv

# Asyncio configuration
asyncio_default_fixture_loop_scope = function
