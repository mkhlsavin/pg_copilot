# Scenario 13: Subsystem Explanation
# Explain PostgreSQL subsystems and their workings

scenario:
  id: "scenario_13_subsystem"
  name: "Subsystem Explanation"
  mapped_workflow: "onboarding_workflow"
  graph_methods: ["module_overview", "subsystem_summary"]

metadata:
  version: "1.0"
  language: "en"
  question_count: 30
  difficulty_distribution: {easy: 10, medium: 12, hard: 8}

questions:
  # === EASY (10) ===
  - id: "SUB_EN_001"
    question: "Explain the PostgreSQL executor subsystem"
    category: "subsystem_overview"
    difficulty: "easy"
    postgresql_subsystem: "executor"
    ground_truth:
      expected_functions: ["ExecInitNode", "ExecProcNode", "ExecEndNode"]
      key_patterns: ["Exec", "executor"]
      required_keywords: ["executor", "plan", "tuple", "node"]
      min_expected_count: 3

  - id: "SUB_EN_002"
    question: "What is the buffer manager and how does it work?"
    category: "subsystem_overview"
    difficulty: "easy"
    postgresql_subsystem: "storage/buffer"
    ground_truth:
      expected_functions: ["ReadBuffer", "ReleaseBuffer", "BufferAlloc"]
      key_patterns: ["Buffer"]
      required_keywords: ["buffer", "page", "cache", "memory"]
      min_expected_count: 3

  - id: "SUB_EN_003"
    question: "Explain the parser subsystem"
    category: "subsystem_overview"
    difficulty: "easy"
    postgresql_subsystem: "parser"
    ground_truth:
