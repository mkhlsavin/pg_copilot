scenario:
  id: scenario_08_compliance
  name: Compliance Checking
  mapped_workflow: compliance_workflow
  graph_methods:
  - check_naming_conventions
  - check_license_headers
  - find_coding_violations

metadata:
  version: '2.0'
  language: en
  question_count: 10
  difficulty_distribution:
    easy: 4
    medium: 4
    hard: 2

questions:
  - id: COMP_EN_001
    question: "Check naming convention violations in the codebase"
    category: naming_conventions
    difficulty: easy
    postgresql_subsystem: general
    ground_truth:
      expected_functions:
        - palloc
        - pfree
        - MemoryContextAlloc
      key_patterns:
        - naming
        - convention
        - style
      required_keywords:
        - naming
        - convention
      min_expected_count: 1
    evaluation:
      metrics: [precision_at_k, recall_at_k, mrr, keyword_coverage]
      semantic_similarity_threshold: 0.7

  - id: COMP_EN_002
    question: "Find functions without proper error handling"
    category: error_handling
    difficulty: medium
    postgresql_subsystem: general
    ground_truth:
      expected_functions:
        - ereport
        - elog
        - PG_TRY
      key_patterns:
        - ereport
        - error
        - handling
        - PG_TRY
      required_keywords:
        - error
        - handling
      min_expected_count: 1
    evaluation:
      metrics: [precision_at_k, recall_at_k, mrr, keyword_coverage]
      semantic_similarity_threshold: 0.7

  - id: COMP_EN_003
    question: "Check for missing license headers"
    category: license
    difficulty: easy
    postgresql_subsystem: general
    ground_truth:
      expected_functions: []
      key_patterns:
        - license
        - copyright
        - header
        - PostgreSQL
      required_keywords:
        - license
        - copyright
      min_expected_count: 0
    evaluation:
      metrics: [precision_at_k, recall_at_k, mrr, keyword_coverage]
      semantic_similarity_threshold: 0.7

  - id: COMP_EN_004
    question: "Find functions violating memory allocation patterns"
    category: memory_patterns
    difficulty: medium
    postgresql_subsystem: memory
    ground_truth:
      expected_functions:
        - palloc
        - pfree
        - MemoryContextAlloc
        - MemoryContextDelete
      key_patterns:
        - palloc
        - pfree
        - MemoryContext
        - memory
      required_keywords:
        - memory
        - alloc
        - palloc
      min_expected_count: 1
    evaluation:
      metrics: [precision_at_k, recall_at_k, mrr, keyword_coverage]
      semantic_similarity_threshold: 0.7

  - id: COMP_EN_005
    question: "Check for deprecated function usage"
    category: deprecated
    difficulty: easy
    postgresql_subsystem: general
    ground_truth:
      expected_functions:
        - pg_deprecated
        - __attribute__
      key_patterns:
        - deprecated
        - obsolete
        - legacy
      required_keywords:
        - deprecated
      min_expected_count: 0
    evaluation:
      metrics: [precision_at_k, recall_at_k, mrr, keyword_coverage]
      semantic_similarity_threshold: 0.7

  - id: COMP_EN_006
    question: "Find coding style violations in function declarations"
    category: coding_style
    difficulty: medium
    postgresql_subsystem: general
    ground_truth:
      expected_functions: []
      key_patterns:
        - style
        - declaration
        - function
        - format
      required_keywords:
        - style
        - function
      min_expected_count: 0
    evaluation:
      metrics: [precision_at_k, recall_at_k, mrr, keyword_coverage]
      semantic_similarity_threshold: 0.7

  - id: COMP_EN_007
    question: "Check for proper use of Assert macros"
    category: assertions
    difficulty: easy
    postgresql_subsystem: general
    ground_truth:
      expected_functions:
        - Assert
