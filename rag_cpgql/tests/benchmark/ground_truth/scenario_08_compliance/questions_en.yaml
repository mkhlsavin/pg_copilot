    evaluation:
      metrics: [precision_at_k, recall_at_k, mrr, keyword_coverage]
      semantic_similarity_threshold: 0.7

  - id: COMP_EN_008
    question: "Find functions with improper locking patterns"
    category: locking_patterns
    difficulty: hard
    postgresql_subsystem: lock_manager
    ground_truth:
      expected_functions:
        - LWLockAcquire
        - LWLockRelease
        - SpinLockAcquire
      key_patterns:
        - Lock
        - Acquire
        - Release
        - pattern
      required_keywords:
        - lock
        - acquire
        - release
      min_expected_count: 1
    evaluation:
      metrics: [precision_at_k, recall_at_k, mrr, keyword_coverage]
      semantic_similarity_threshold: 0.7

  - id: COMP_EN_009
    question: "Check for proper transaction handling patterns"
    category: transaction_patterns
    difficulty: medium
    postgresql_subsystem: transaction
    ground_truth:
      expected_functions:
