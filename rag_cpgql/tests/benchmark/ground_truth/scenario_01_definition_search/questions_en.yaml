# Scenario 01: Definition Search
# Search for function/variable definitions and their mentions

scenario:
  id: "scenario_01_definition_search"
  name: "Definition Search"
  mapped_workflow: "documentation_workflow"
  graph_methods: ["find_definition", "find_all_references"]

metadata:
  version: "1.0"
  language: "en"
  question_count: 35
  difficulty_distribution: {easy: 12, medium: 15, hard: 8}

questions:
  # === EASY (12) ===
  - id: "DEF_EN_001"
    question: "Where is the function heap_insert defined?"
    category: "function_definition"
    difficulty: "easy"
    postgresql_subsystem: "storage/heap"
    target_function: "heap_insert"
    expected_behavior:
      retrieval_type: "definition"
      search_pattern: "heap_insert"
    ground_truth:
      expected_functions: ["heap_insert"]
      key_patterns: ["heap_insert", "heapam.c", "storage"]
      required_keywords: ["heap", "insert", "tuple", "relation"]
      min_expected_count: 1
    evaluation:
      metrics: [precision_at_k, recall_at_k, mrr, keyword_coverage]
      semantic_similarity_threshold: 0.7

  - id: "DEF_EN_002"
    question: "What is the signature of ExecProcNode?"
    category: "function_signature"
    difficulty: "easy"
    postgresql_subsystem: "executor"
    target_function: "ExecProcNode"
    expected_behavior:
      retrieval_type: "definition"
      search_pattern: "ExecProcNode"
    ground_truth:
      expected_functions: ["ExecProcNode"]
      key_patterns: ["ExecProcNode", "PlanState", "TupleTableSlot"]
      required_keywords: ["PlanState", "return", "TupleTableSlot"]
      min_expected_count: 1

  - id: "DEF_EN_003"
    question: "Find the definition of InvalidOid macro"
    category: "macro_definition"
    difficulty: "easy"
    postgresql_subsystem: "include"
    target_function: "InvalidOid"
    ground_truth:
      expected_functions: ["InvalidOid"]
      key_patterns: ["#define\\s+InvalidOid", "\\(Oid\\)\\s*0"]
      required_keywords: ["define", "Oid", "invalid"]

  - id: "DEF_EN_004"
    question: "Where is RelationGetRelationName defined?"
    category: "macro_definition"
    difficulty: "easy"
    postgresql_subsystem: "access"
    target_function: "RelationGetRelationName"
    ground_truth:
      expected_functions: ["RelationGetRelationName"]
      key_patterns: ["RelationGetRelationName", "rel.*relname"]
      required_keywords: ["relation", "name"]

  - id: "DEF_EN_005"
    question: "Find definition of palloc function"
    category: "function_definition"
    difficulty: "easy"
    postgresql_subsystem: "utils/palloc"
    target_function: "palloc"
    ground_truth:
      expected_functions: ["palloc", "MemoryContextAlloc"]
      key_patterns: ["palloc", "memory", "alloc"]
      required_keywords: ["palloc", "memory"]

  - id: "DEF_EN_006"
    question: "What is the definition of Oid type?"
    category: "type_definition"
    difficulty: "easy"
    postgresql_subsystem: "include/c"
    target_function: "Oid"
    ground_truth:
      expected_functions: []
      key_patterns: ["typedef.*Oid", "unsigned int"]
      required_keywords: ["typedef", "unsigned", "object", "identifier"]

  - id: "DEF_EN_007"
    question: "Find where ereport is defined"
    category: "macro_definition"
    difficulty: "easy"
    postgresql_subsystem: "utils/elog"
    target_function: "ereport"
    ground_truth:
      expected_functions: ["ereport", "errstart", "errfinish", "errmsg"]
      key_patterns: ["ereport", "errstart"]
      required_keywords: ["error", "ereport"]

  - id: "DEF_EN_008"
    question: "Where is the Datum type defined?"
    category: "type_definition"
    difficulty: "easy"
    postgresql_subsystem: "include/postgres"
    target_function: "Datum"
    ground_truth:
      expected_functions: ["DatumGetArrayTypeP", "CStringGetTextDatum", "TextDatumGetCString"]
      key_patterns: ["Datum", "datum"]
      required_keywords: ["datum"]

  - id: "DEF_EN_009"
    question: "Find definition of tuples_equal function"
    category: "function_definition"
    difficulty: "easy"
    postgresql_subsystem: "executor"
    target_function: "tuples_equal"
    ground_truth:
      expected_functions: ["tuples_equal", "equalTupleDescs", "execTuplesUnequal"]
      key_patterns: ["tuple.*equal", "equal"]
      required_keywords: ["tuple", "equal"]

  - id: "DEF_EN_010"
    question: "What is the struct definition of PlanState?"
    category: "struct_definition"
    difficulty: "easy"
    postgresql_subsystem: "nodes/execnodes"
    target_function: "PlanState"
    ground_truth:
      expected_functions: []
      key_patterns: ["struct\\s+PlanState", "Plan\\s*\\*plan"]
      required_keywords: ["struct", "plan", "state", "node"]

  - id: "DEF_EN_011"
    question: "Where is hash_any defined?"
    category: "function_definition"
    difficulty: "easy"
