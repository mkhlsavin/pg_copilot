# Сценарий 01: Поиск определений
# Поиск определений функций/переменных и их упоминаний

scenario:
  id: "scenario_01_definition_search"
  name: "Поиск определений"
  mapped_workflow: "documentation_workflow"
  graph_methods: ["find_definition", "find_all_references"]

metadata:
  version: "1.0"
  language: "ru"
  question_count: 35
  difficulty_distribution: {easy: 12, medium: 15, hard: 8}

questions:
  # === ЛЕГКО (12) ===
  - id: "DEF_RU_001"
    question: "Где определена функция heap_insert?"
    category: "function_definition"
    difficulty: "easy"
    postgresql_subsystem: "storage/heap"
    target_function: "heap_insert"
    ground_truth:
      expected_functions: ["heap_insert"]
      key_patterns: ["heap_insert", "heapam.c", "storage"]
      required_keywords: ["heap", "insert", "кортеж", "отношение"]
      min_expected_count: 1

  - id: "DEF_RU_002"
    question: "Какова сигнатура функции ExecProcNode?"
    category: "function_signature"
    difficulty: "easy"
    postgresql_subsystem: "executor"
    target_function: "ExecProcNode"
    ground_truth:
      expected_functions: ["ExecProcNode"]
      key_patterns: ["ExecProcNode", "PlanState", "TupleTableSlot"]
      required_keywords: ["PlanState", "возвращает", "TupleTableSlot"]

  - id: "DEF_RU_003"
    question: "Найдите определение макроса InvalidOid"
    category: "macro_definition"
    difficulty: "easy"
    postgresql_subsystem: "include"
    target_function: "InvalidOid"
    ground_truth:
      expected_functions: ["InvalidOid"]
      key_patterns: ["#define\\s+InvalidOid", "\\(Oid\\)\\s*0"]
      required_keywords: ["define", "Oid", "недопустимый"]

  - id: "DEF_RU_004"
    question: "Где определён RelationGetRelationName?"
