    category: "crypto_weak"
    difficulty: "hard"
    ground_truth:
      expected_functions: ["md5_crypt", "pg_md5"]
      key_patterns: ["md5", "crypt"]
      required_keywords: ["cryptographic", "weakness", "hash"]
      min_expected_count: 2

  - id: "NVULN_EN_023"
    question: "Find memory corruption vulnerabilities"
    category: "memory_corruption"
    difficulty: "hard"
    ground_truth:
      expected_functions: ["memcpy", "memmove"]
      key_patterns: ["memcpy", "buffer"]
      required_keywords: ["memory", "corruption", "buffer"]
