  - id: "NVULN_EN_026"
    question: "Find zero-day vulnerability patterns"
    category: "zero_day"
    difficulty: "hard"
    ground_truth:
      expected_functions: []
      key_patterns: ["dangerous", "unsafe"]
      required_keywords: ["zero-day", "pattern", "vulnerability"]
      min_expected_count: 2

  - id: "NVULN_EN_027"
    question: "Analyze CVE-like patterns in codebase"
    category: "cve_patterns"
    difficulty: "hard"
    ground_truth:
      expected_functions: []
      key_patterns: ["CVE", "vulnerability"]
      required_keywords: ["CVE", "pattern", "analysis"]
      min_expected_count: 2

  - id: "NVULN_EN_028"
    question: "Find container escape vectors"
    category: "container_escape"
