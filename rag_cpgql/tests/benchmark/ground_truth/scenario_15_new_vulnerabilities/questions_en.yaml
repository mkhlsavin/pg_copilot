  - id: "NVULN_EN_024"
    question: "Find race condition vulnerabilities"
    category: "race_condition"
    difficulty: "hard"
    ground_truth:
      expected_functions: ["LWLockAcquire"]
      key_patterns: ["lock", "race"]
      required_keywords: ["race", "condition", "concurrent"]
      min_expected_count: 2

  - id: "NVULN_EN_025"
    question: "Find supply chain attack vectors (extension loading)"
