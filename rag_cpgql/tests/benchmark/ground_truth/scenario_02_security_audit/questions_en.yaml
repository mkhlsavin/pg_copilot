scenario:
  id: scenario_02_security_audit
  name: Security Audit
  mapped_workflow: security_workflow
  graph_methods:
  - find_vulnerabilities
  - find_entry_points
  - trace_taint_flow
metadata:
  version: '2.0'
  language: en
  question_count: 90
  difficulty_distribution:
    easy: 20
    medium: 40
    hard: 30
  consolidated_from:
  - scenario_04_vulnerability
  - scenario_08_entry_points
  - scenario_15_new_vulnerabilities
questions:
- id: VULN_EN_001
