    - SPI_execute
    - SPI_exec
    - SPI_execute_plan
    - SPI_execute_extended
    - exec_simple_query
    - pg_parse_query
    key_patterns:
    - SPI_execute
    - dynamic.*query
    - sprintf.*query
    required_keywords:
    - SQL
    - injection
    - dynamic
    - query
    min_expected_count: 3
