# Scenario 06: Complexity and Hotspots Analysis
# Analyze code complexity and identify performance-critical functions

scenario:
  id: "scenario_06_complexity"
  name: "Complexity and Hotspots"
  mapped_workflow: "performance_workflow"
  graph_methods: ["CallGraphAnalyzer", "PageRank", "betweenness_centrality", "complexity_metrics"]

metadata:
  version: "1.0"
  language: "en"
  question_count: 30
  difficulty_distribution: {easy: 8, medium: 14, hard: 8}

questions:
  # === EASY (8) ===
  - id: "PERF_EN_001"
    question: "Find functions with highest cyclomatic complexity in executor"
    category: "cyclomatic_complexity"
    difficulty: "easy"
    postgresql_subsystem: "executor"
    ground_truth:
      # Updated to include actual high-complexity executor functions (by line count as proxy)
      expected_functions: ["ExecInitExprRec", "ExecInterpExpr", "ExecInitAgg", "ExecMergeJoin", "ExecProcNode", "ExecInitNode", "ExecMergeMatched", "ExecIndexBuildScanKeys", "ExecInitPartitionInfo", "ExecInitModifyTable"]
      key_patterns: ["Exec.*"]
      required_keywords: ["cyclomatic", "complexity", "executor"]
      min_expected_count: 3

  - id: "PERF_EN_002"
    question: "What are the most called functions (highest in-degree)?"
    category: "in_degree"
    difficulty: "easy"
    ground_truth:
      # High in-degree includes: system utilities (printf, snprintf), relation accessors,
      # and common macros used throughout the codebase
      expected_functions: ["printf", "snprintf", "RelationGetDescr", "RelationGetRelid", "NameStr", "gettext_noop", "BTEqualStrategyNumber", "unlikely", "Assert", "elog", "pfree", "palloc"]
      key_patterns: ["printf", "Relation.*", "Assert"]
      required_keywords: ["called", "in-degree", "most"]
      min_expected_count: 3

  - id: "PERF_EN_003"
    question: "Find functions with more than 500 lines of code"
    category: "loc_metric"
    difficulty: "easy"
    ground_truth:
      expected_functions: []
      key_patterns: ["lines", "LOC"]
      required_keywords: ["lines", "code", "large"]
      min_expected_count: 2

  - id: "PERF_EN_004"
    question: "List functions with more than 10 parameters"
    category: "param_count"
    difficulty: "easy"
    ground_truth:
      expected_functions: []
      key_patterns: ["parameter", "argument"]
      required_keywords: ["parameters", "many", "complex"]
      min_expected_count: 2

  - id: "PERF_EN_005"
    question: "Find deeply nested functions (nesting level > 5)"
    category: "nesting_depth"
    difficulty: "easy"
    ground_truth:
      expected_functions: []
      key_patterns: ["nested", "depth"]
      required_keywords: ["nested", "depth", "level"]
      min_expected_count: 2

  - id: "PERF_EN_006"
    question: "What functions have the most local variables?"
    category: "local_vars"
    difficulty: "easy"
    ground_truth:
      expected_functions: []
      key_patterns: ["variable", "local"]
      required_keywords: ["local", "variables", "most"]
      min_expected_count: 2

  - id: "PERF_EN_007"
    question: "Find functions with multiple return points"
    category: "return_points"
    difficulty: "easy"
    ground_truth:
      expected_functions: []
      key_patterns: ["return"]
      required_keywords: ["return", "multiple", "exit"]
      min_expected_count: 3

  - id: "PERF_EN_008"
    question: "List functions with the most switch/case branches"
    category: "switch_branches"
    difficulty: "easy"
    ground_truth:
      expected_functions: ["ExecInitNode", "nodeTag"]
      key_patterns: ["switch", "case"]
      required_keywords: ["switch", "case", "branches"]
      min_expected_count: 2

  # === MEDIUM (14) ===
  - id: "PERF_EN_009"
    question: "Find performance hotspots using PageRank analysis"
