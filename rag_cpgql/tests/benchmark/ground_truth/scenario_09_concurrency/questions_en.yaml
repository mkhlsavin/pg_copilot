# Scenario 09: Concurrency Analysis
# Analyze concurrency issues, race conditions, and synchronization

scenario:
  id: "scenario_09_concurrency"
  name: "Concurrency Analysis"
  mapped_workflow: "concurrency_workflow"
  graph_methods: ["lock_analysis", "race_detection", "shared_access"]

metadata:
  version: "1.0"
  language: "en"
  question_count: 30
  difficulty_distribution: {easy: 6, medium: 14, hard: 10}

questions:
  # === EASY (6) ===
  - id: "CONC_EN_001"
    question: "Find all functions that use LWLock for synchronization"
    category: "lock_usage"
    difficulty: "easy"
    postgresql_subsystem: "storage/lmgr"
    ground_truth:
      expected_functions: ["LWLockAcquire", "LWLockRelease", "LWLockConditionalAcquire"]
      key_patterns: ["LWLock"]
      required_keywords: ["LWLock", "synchronization", "lock"]
      min_expected_count: 3

  - id: "CONC_EN_002"
    question: "Find all SpinLock usage in the codebase"
    category: "spinlock_usage"
    difficulty: "easy"
    ground_truth:
      expected_functions: ["SpinLockAcquire", "SpinLockRelease"]
      key_patterns: ["SpinLock"]
      required_keywords: ["SpinLock", "spin", "busy"]
      min_expected_count: 2

  - id: "CONC_EN_003"
    question: "Find functions that access shared memory"
    category: "shmem_access"
    difficulty: "easy"
    postgresql_subsystem: "storage/ipc"
    ground_truth:
      expected_functions: ["ShmemInitStruct", "ShmemAlloc"]
      key_patterns: ["Shmem", "shared"]
      required_keywords: ["shared", "memory", "access"]
      min_expected_count: 2

  - id: "CONC_EN_004"
    question: "List functions with volatile variable access"
    category: "volatile_access"
    difficulty: "easy"
    ground_truth:
      expected_functions: []
      key_patterns: ["volatile", "pg_atomic"]
      required_keywords: ["volatile", "atomic", "variable"]
      min_expected_count: 2

  - id: "CONC_EN_005"
    question: "Find atomic operation functions"
    category: "atomic_ops"
    difficulty: "easy"
    ground_truth:
      expected_functions: ["pg_atomic_read_u32", "pg_atomic_write_u32", "pg_atomic_compare_exchange"]
      key_patterns: ["pg_atomic"]
      required_keywords: ["atomic", "operation"]
      min_expected_count: 3

  - id: "CONC_EN_006"
    question: "Find barrier/fence memory operations"
    category: "memory_barriers"
    difficulty: "easy"
    ground_truth:
      expected_functions: ["pg_memory_barrier", "pg_read_barrier", "pg_write_barrier"]
      key_patterns: ["barrier", "fence"]
      required_keywords: ["barrier", "memory", "fence"]
      min_expected_count: 2

  # === MEDIUM (14) ===
  - id: "CONC_EN_007"
    question: "Find race conditions in buffer management"
    category: "buffer_race"
    difficulty: "medium"
    postgresql_subsystem: "storage/buffer"
    ground_truth:
      expected_functions: ["BufferSync", "ReadBuffer", "PinBuffer"]
      key_patterns: ["Buffer", "race"]
      required_keywords: ["race", "condition", "buffer"]
      min_expected_count: 2

  - id: "CONC_EN_008"
    question: "Analyze lock ordering issues with LWLock"
    category: "lock_ordering"
    difficulty: "medium"
    postgresql_subsystem: "storage/lmgr"
    ground_truth:
      expected_functions: ["LWLockAcquire", "LWLockHeldByMe"]
      key_patterns: ["LWLock", "order"]
      required_keywords: ["lock", "ordering", "deadlock"]
      min_expected_count: 2

  - id: "CONC_EN_009"
    question: "Find TOCTOU vulnerabilities in file operations"
    category: "toctou"
    difficulty: "medium"
    postgresql_subsystem: "storage/file"
    ground_truth:
      expected_functions: ["stat", "access", "open"]
      key_patterns: ["stat.*open", "access.*open"]
      required_keywords: ["TOCTOU", "time", "check", "use"]
      min_expected_count: 2

  - id: "CONC_EN_010"
    question: "Find shared variable access without proper locking"
