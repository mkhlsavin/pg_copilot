scenario:
  id: scenario_13_mass_refactoring
  name: Mass Refactoring Automation
  mapped_workflow: mass_refactoring_workflow
  graph_methods:
  - find_all_references
  - bulk_rename
  - update_signatures

metadata:
  version: '2.0'
  language: en
  question_count: 10
  difficulty_distribution:
    easy: 3
    medium: 5
    hard: 2

questions:
  - id: MASS_EN_001
    question: "Find all references to ExecProcNode for renaming"
    category: bulk_rename
    difficulty: easy
    postgresql_subsystem: executor
    ground_truth:
      expected_functions:
        - ExecProcNode
        - ExecProcNodeFirst
        - ExecProcNodeInstr
      key_patterns:
        - ExecProcNode
        - reference
        - rename
        - executor
      required_keywords:
        - exec
        - node
        - rename
      min_expected_count: 1
    evaluation:
      metrics: [precision_at_k, recall_at_k, mrr, keyword_coverage]
      semantic_similarity_threshold: 0.7

  - id: MASS_EN_002
    question: "Find all usages of palloc for memory API migration"
    category: api_migration
    difficulty: medium
    postgresql_subsystem: memory
    ground_truth:
      expected_functions:
        - palloc
        - palloc0
        - repalloc
        - pfree
      key_patterns:
        - palloc
        - memory
        - alloc
        - migration
      required_keywords:
