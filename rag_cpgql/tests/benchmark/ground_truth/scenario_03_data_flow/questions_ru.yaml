    ground_truth:
      expected_functions: ["heap_getnext", "heapgettup"]
      key_patterns: ["tuple", "HeapTuple"]
      required_keywords: ["кортеж", "следующий", "сканирование"]

  # === СРЕДНЕ (12) ===
  - id: "DF_RU_009"
    question: "Найдите достигающие определения для 'slot' в ExecScan"
    category: "reaching_definitions"
    difficulty: "medium"
    postgresql_subsystem: "executor"
    target_function: "ExecScan"
    target_variable: "slot"
    ground_truth:
      expected_functions: ["ExecScan", "ExecScanFetch", "ExecStoreTuple"]
      key_patterns: ["slot", "TupleTableSlot", "Exec.*"]
      required_keywords: ["достигающие", "определения", "slot"]
      min_expected_count: 2

  - id: "DF_RU_010"
    question: "Проследите все использования 'xid' из GetNewTransactionId по кодовой базе"
    category: "transitive_flow"
    difficulty: "medium"
