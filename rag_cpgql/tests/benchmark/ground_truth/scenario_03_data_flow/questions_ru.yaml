# Сценарий 03: Трассировка потока данных
# Отслеживание потока данных и распространения переменных через код

scenario:
  id: "scenario_03_data_flow"
  name: "Трассировка потока данных"
  mapped_workflow: "security_workflow"
  graph_methods: ["DataFlowTracer", "trace_variable", "reaching_definitions", "use_def_chain"]

metadata:
  version: "1.0"
  language: "ru"
  question_count: 30
  difficulty_distribution: {easy: 8, medium: 12, hard: 10}

questions:
  # === ЛЕГКО (8) ===
  - id: "DF_RU_001"
    question: "Проследите переменную 'relid' в функции heap_open"
    category: "variable_trace"
    difficulty: "easy"
    postgresql_subsystem: "access/heap"
    target_function: "heap_open"
    target_variable: "relid"
    ground_truth:
      expected_functions: ["heap_open", "relation_open", "LockRelationOid"]
      key_patterns: ["relid", "Oid", "relation"]
      required_keywords: ["relid", "отношение", "открыть", "блокировка"]
      min_expected_count: 2

  - id: "DF_RU_002"
    question: "Где переменная 'slot' получает значение в ExecScan?"
    category: "assignment_trace"
    difficulty: "easy"
    postgresql_subsystem: "executor"
    target_function: "ExecScan"
    target_variable: "slot"
    ground_truth:
      expected_functions: ["ExecScan", "ExecScanFetch"]
      key_patterns: ["slot", "TupleTableSlot"]
      required_keywords: ["slot", "кортеж", "присвоение"]

  - id: "DF_RU_003"
    question: "Проследите переменную buffer через функцию ReadBuffer"
    category: "variable_trace"
    difficulty: "easy"
    postgresql_subsystem: "storage/buffer"
    target_function: "ReadBuffer"
    target_variable: "buffer"
    ground_truth:
      expected_functions: ["ReadBuffer", "ReadBufferExtended"]
      key_patterns: ["Buffer", "buffer"]
      required_keywords: ["буфер", "чтение", "страница"]

  - id: "DF_RU_004"
    question: "Каков поток данных 'xid' в GetNewTransactionId?"
    category: "variable_trace"
    difficulty: "easy"
    postgresql_subsystem: "access/transam"
    target_function: "GetNewTransactionId"
    target_variable: "xid"
    ground_truth:
      expected_functions: ["GetNewTransactionId", "TransactionIdAdvance"]
      key_patterns: ["xid", "TransactionId"]
      required_keywords: ["транзакция", "идентификатор", "новый"]

  - id: "DF_RU_005"
    question: "Проследите как 'queryString' проходит через exec_simple_query"
    category: "string_trace"
    difficulty: "easy"
    postgresql_subsystem: "tcop"
    target_function: "exec_simple_query"
    target_variable: "queryString"
    ground_truth:
      expected_functions: ["exec_simple_query", "pg_parse_query"]
      key_patterns: ["queryString", "query"]
      required_keywords: ["запрос", "строка", "парсинг"]

  - id: "DF_RU_006"
    question: "Где присваивается 'result' в ExecProcNode?"
    category: "assignment_trace"
    difficulty: "easy"
    postgresql_subsystem: "executor"
    target_function: "ExecProcNode"
    target_variable: "result"
    ground_truth:
      expected_functions: ["ExecProcNode"]
      key_patterns: ["result", "TupleTableSlot"]
      required_keywords: ["результат", "кортеж", "возврат"]

  - id: "DF_RU_007"
    question: "Проследите переменную 'portal' в PortalRun"
    category: "variable_trace"
    difficulty: "easy"
    postgresql_subsystem: "tcop"
    target_function: "PortalRun"
    target_variable: "portal"
    ground_truth:
      expected_functions: ["PortalRun", "PortalRunSelect"]
      key_patterns: ["portal", "Portal"]
      required_keywords: ["портал", "выполнение", "запрос"]

  - id: "DF_RU_008"
    question: "Как 'tuple' проходит через heap_getnext?"
    category: "variable_trace"
    difficulty: "easy"
    postgresql_subsystem: "access/heap"
    target_function: "heap_getnext"
