# Scenario 03: Data Flow Tracing
# Trace data flow and variable propagation through code

scenario:
  id: "scenario_03_data_flow"
  name: "Data Flow Tracing"
  mapped_workflow: "security_workflow"
  graph_methods: ["DataFlowTracer", "trace_variable", "reaching_definitions", "use_def_chain"]

metadata:
  version: "1.0"
  language: "en"
  question_count: 30
  difficulty_distribution: {easy: 8, medium: 12, hard: 10}

questions:
  # === EASY (8) ===
  - id: "DF_EN_001"
    question: "Trace the variable 'relid' in relation_open function"
    category: "variable_trace"
    difficulty: "easy"
    postgresql_subsystem: "access/common"
    target_function: "relation_open"
    target_variable: "relid"
    ground_truth:
      expected_functions: ["relation_open", "relation_openrv", "relation_openrv_extended", "try_relation_open", "LockRelationOid", "CacheInvalidateRelcacheByRelid"]
      key_patterns: ["relid", "Oid", "relation"]
      required_keywords: ["relation_open"]
      min_expected_count: 1

  - id: "DF_EN_002"
    question: "Where does the 'slot' variable get assigned in ExecScan?"
    category: "assignment_trace"
    difficulty: "easy"
    postgresql_subsystem: "executor"
    target_function: "ExecScan"
    target_variable: "slot"
    ground_truth:
      expected_functions: ["ExecScan", "ExecScanFetch", "ExecStoreTuple", "ExecClearTuple", "ExecStoreHeapTuple"]
      key_patterns: ["slot", "TupleTableSlot"]
      required_keywords: ["ExecScan"]
      min_expected_count: 1

  - id: "DF_EN_003"
    question: "Trace the buffer variable through ReadBuffer function"
    category: "variable_trace"
    difficulty: "easy"
    postgresql_subsystem: "storage/buffer"
    target_function: "ReadBuffer"
    target_variable: "buffer"
    ground_truth:
      expected_functions: ["ReadBuffer", "ReadBufferExtended", "ReadBuffer_common", "BufferAlloc"]
      key_patterns: ["Buffer", "buffer"]
      required_keywords: ["ReadBuffer"]
      min_expected_count: 1

  - id: "DF_EN_004"
    question: "What is the data flow of 'xid' in GetNewTransactionId?"
    category: "variable_trace"
    difficulty: "easy"
    postgresql_subsystem: "access/transam"
    target_function: "GetNewTransactionId"
    target_variable: "xid"
    ground_truth:
      # Simplified to core functions that should appear in top results
      expected_functions: ["GetNewTransactionId", "FullTransactionIdFromEpochAndXid", "XidFromFullTransactionId", "FullTransactionIdAdvance"]
      key_patterns: ["xid", "TransactionId", "transaction"]
      required_keywords: ["GetNewTransactionId"]
      min_expected_count: 1

  - id: "DF_EN_005"
    question: "Trace how 'queryString' flows in exec_simple_query"
    category: "string_trace"
    difficulty: "easy"
    postgresql_subsystem: "tcop"
    target_function: "exec_simple_query"
    target_variable: "queryString"
    ground_truth:
      # Simplified to core functions that should appear in top results
      expected_functions: ["exec_simple_query", "pg_parse_query", "BeginCommand", "EndCommand", "CreateCommandTag"]
      key_patterns: ["queryString", "query", "exec", "parse", "Command"]
      required_keywords: ["exec_simple_query"]
      min_expected_count: 1

  - id: "DF_EN_006"
    question: "Where is 'result' assigned in ExecProcNode?"
    category: "assignment_trace"
    difficulty: "easy"
    postgresql_subsystem: "executor"
    target_function: "ExecProcNode"
    target_variable: "result"
    ground_truth:
      # ExecProcNode only calls ExecReScan
      expected_functions: ["ExecProcNode", "ExecReScan"]
      key_patterns: ["result", "TupleTableSlot", "Exec"]
      required_keywords: ["result", "ExecProcNode"]

  - id: "DF_EN_007"
    question: "Trace 'portal' variable in PortalRun"
    category: "variable_trace"
    difficulty: "easy"
    postgresql_subsystem: "tcop"
    target_function: "PortalRun"
    target_variable: "portal"
    ground_truth:
      # Expanded with actual callees from call_containment table
      expected_functions: ["PortalRun", "MarkPortalFailed", "MarkPortalActive", "PortalRunSelect", "elog", "Assert", "FillPortalStore", "ShowUsage", "ResetUsage", "InitializeQueryCompletion"]
      key_patterns: ["portal", "Portal", "Mark", "Query"]
      required_keywords: ["PortalRun"]
      min_expected_count: 1

  - id: "DF_EN_008"
    question: "How does 'tuple' flow through heap_getnext?"
    category: "variable_trace"
    difficulty: "easy"
    postgresql_subsystem: "access/heap"
    target_function: "heap_getnext"
    target_variable: "tuple"
    ground_truth:
      # Expanded with actual callees from call_containment table
      expected_functions: ["heap_getnext", "heapgettup", "heapgettup_pagemode", "GetHeapamTableAmRoutine", "ereport", "elog", "errcode", "pgstat_assoc_relation"]
      key_patterns: ["tuple", "heap", "gettup", "pagemode"]
      required_keywords: ["heap_getnext"]
      min_expected_count: 1

  # === MEDIUM (12) ===
  - id: "DF_EN_009"
    question: "Find reaching definitions for 'slot' in ExecScan"
    category: "reaching_definitions"
    difficulty: "medium"
    postgresql_subsystem: "executor"
    target_function: "ExecScan"
    target_variable: "slot"
    ground_truth:
      # Note: This query is often parsed as definition query, not dataflow
      expected_functions: ["ExecScan", "ExecScanFetch", "ExecClearTuple", "ExecProject", "ExecQual", "ExecQualAndReset", "ExecFilterJunk"]
      key_patterns: ["slot", "TupleTableSlot", "Exec"]
      required_keywords: ["ExecScan"]
      min_expected_count: 1

  - id: "DF_EN_010"
    question: "Trace the 'xid' variable usage in GetNewTransactionId and its callees"
    category: "transitive_flow"
    difficulty: "medium"
    postgresql_subsystem: "access/transam"
    target_function: "GetNewTransactionId"
    target_variable: "xid"
    ground_truth:
      # Expanded with actual callees from call_containment table
      expected_functions: ["GetNewTransactionId", "FullTransactionIdFromEpochAndXid", "LWLockAcquire", "elog", "XidFromFullTransactionId", "FullTransactionIdAdvance", "Assert", "errmsg"]
      key_patterns: ["xid", "TransactionId", "Extend", "LWLock"]
      required_keywords: ["GetNewTransactionId"]
      min_expected_count: 1

  - id: "DF_EN_011"
    question: "Find the def-use chain for 'econtext' in expression evaluation"
    category: "def_use_chain"
    difficulty: "medium"
    postgresql_subsystem: "executor"
    target_variable: "econtext"
    ground_truth:
      expected_functions: ["ExecEvalExpr", "ExecInitExpr"]
      key_patterns: ["econtext", "ExprContext"]
      required_keywords: ["expression", "context", "evaluation"]
      min_expected_count: 2

  - id: "DF_EN_012"
    question: "Trace inter-procedural flow of 'planstate' from standard_ExecutorStart"
    category: "interprocedural_flow"
    difficulty: "medium"
    postgresql_subsystem: "executor"
    target_function: "standard_ExecutorStart"
    target_variable: "planstate"
    ground_truth:
      expected_functions: ["standard_ExecutorStart", "ExecInitNode", "ExecProcNode"]
      key_patterns: ["planstate", "PlanState"]
      required_keywords: ["plan", "state", "executor"]
      min_expected_count: 3

  - id: "DF_EN_013"
    question: "Find all data sinks for user input from ReadCommand"
    category: "sink_analysis"
    difficulty: "medium"
    postgresql_subsystem: "libpq"
    target_function: "ReadCommand"
    ground_truth:
      expected_functions: ["ReadCommand", "pg_parse_query", "exec_simple_query"]
      key_patterns: ["query", "command", "input"]
      required_keywords: ["input", "sink", "command"]
      min_expected_count: 2

  - id: "DF_EN_014"
    question: "Trace how 'lockmode' propagates from LockRelation"
    category: "value_propagation"
    difficulty: "medium"
    postgresql_subsystem: "storage/lmgr"
    target_function: "LockRelation"
    target_variable: "lockmode"
    ground_truth:
      expected_functions: ["LockRelation", "LockAcquire"]
      key_patterns: ["lockmode", "LOCKMODE"]
      required_keywords: ["lock", "mode", "acquire"]

  - id: "DF_EN_015"
    question: "Find def-use chain for 'targetlist' in query planning"
    category: "def_use_chain"
    difficulty: "medium"
    postgresql_subsystem: "optimizer"
    target_variable: "targetlist"
    ground_truth:
      expected_functions: ["standard_planner", "subquery_planner"]
      key_patterns: ["targetlist", "TargetEntry"]
      required_keywords: ["target", "list", "planner"]
      min_expected_count: 2

  - id: "DF_EN_016"
    question: "Trace 'snapshot' variable through table scan operations"
    category: "variable_trace"
    difficulty: "medium"
    postgresql_subsystem: "access/table"
    target_variable: "snapshot"
    ground_truth:
      expected_functions: ["table_beginscan", "heap_beginscan"]
      key_patterns: ["snapshot", "Snapshot"]
      required_keywords: ["snapshot", "scan", "visibility"]
      min_expected_count: 2

  - id: "DF_EN_017"
    question: "Find data flow from pg_parse_query to executor"
    category: "module_flow"
    difficulty: "medium"
    ground_truth:
      expected_functions: ["pg_parse_query", "pg_analyze_and_rewrite", "pg_plan_queries", "standard_ExecutorStart"]
      key_patterns: ["parse", "analyze", "plan", "Exec"]
      required_keywords: ["parse", "plan", "execute", "flow"]
      min_expected_count: 4

  - id: "DF_EN_018"
    question: "Trace how 'cstate' flows in COPY command"
    category: "variable_trace"
    difficulty: "medium"
    postgresql_subsystem: "commands/copy"
    target_variable: "cstate"
    ground_truth:
      expected_functions: ["DoCopy", "BeginCopyFrom", "NextCopyFrom"]
      key_patterns: ["cstate", "CopyState"]
      required_keywords: ["copy", "state", "data"]
      min_expected_count: 2

  - id: "DF_EN_019"
    question: "Find reaching definitions for buffer descriptors in BufferSync"
    category: "reaching_definitions"
    difficulty: "medium"
    postgresql_subsystem: "storage/buffer"
    target_function: "BufferSync"
    ground_truth:
      expected_functions: ["BufferSync", "SyncOneBuffer", "FlushBuffer"]
      key_patterns: ["BufferDesc", "buffer"]
      required_keywords: ["buffer", "sync", "flush"]
      min_expected_count: 2

  - id: "DF_EN_020"
    question: "Trace 'parsetree' through the transformation stage"
    category: "variable_trace"
    difficulty: "medium"
    postgresql_subsystem: "parser"
    target_variable: "parsetree"
    ground_truth:
      expected_functions: ["transformStmt", "transformSelectStmt"]
      key_patterns: ["parsetree", "ParseState"]
      required_keywords: ["parse", "tree", "transform"]
      min_expected_count: 2

  # === HARD (10) ===
  - id: "DF_EN_021"
    question: "Perform inter-procedural data flow from pg_parse_query to executor"
    category: "interprocedural_flow"
    difficulty: "hard"
    ground_truth:
      expected_functions: ["pg_parse_query", "pg_analyze_and_rewrite", "pg_plan_queries", "standard_ExecutorRun"]
      key_patterns: ["parse", "rewrite", "plan", "exec"]
      required_keywords: ["interprocedural", "flow", "query", "execution"]
      min_expected_count: 4

  - id: "DF_EN_022"
    question: "Find taint path from ReadCommandLine to SPI_execute"
    category: "taint_analysis"
    difficulty: "hard"
    ground_truth:
      expected_functions: ["ReadCommand", "exec_simple_query", "SPI_execute"]
      key_patterns: ["command", "query", "SPI"]
      required_keywords: ["taint", "input", "SPI", "execute"]
      min_expected_count: 3

  - id: "DF_EN_023"
    question: "Trace sensitive data flow from password input to authentication"
    category: "sensitive_data_flow"
    difficulty: "hard"
    postgresql_subsystem: "libpq/auth"
    ground_truth:
      expected_functions: ["recv_password_packet", "CheckPassword", "md5_crypt_verify"]
      key_patterns: ["password", "auth", "crypt"]
      required_keywords: ["password", "authentication", "sensitive"]
      min_expected_count: 2

  - id: "DF_EN_024"
    question: "Find all paths where user input reaches memory allocation"
    category: "taint_to_sink"
    difficulty: "hard"
    ground_truth:
      expected_functions: ["pg_parse_query", "palloc", "MemoryContextAlloc"]
      key_patterns: ["input", "palloc", "alloc"]
      required_keywords: ["input", "allocation", "memory", "taint"]
      min_expected_count: 3

  - id: "DF_EN_025"
    question: "Trace the complete lifecycle of a transaction ID"
    category: "lifecycle_trace"
    difficulty: "hard"
    postgresql_subsystem: "access/transam"
    ground_truth:
      expected_functions: ["GetNewTransactionId", "TransactionIdStore", "RecordTransactionCommit", "TransactionIdPrecedes"]
      key_patterns: ["xid", "TransactionId"]
      required_keywords: ["transaction", "lifecycle", "commit"]
      min_expected_count: 4

  - id: "DF_EN_026"
    question: "Find all paths from environment variables to system calls"
    category: "env_to_syscall"
    difficulty: "hard"
    ground_truth:
      expected_functions: ["getenv", "system", "popen"]
      key_patterns: ["getenv", "env", "system"]
      required_keywords: ["environment", "system", "call", "path"]
      min_expected_count: 2

  - id: "DF_EN_027"
    question: "Trace how query parameters flow to prepared statement execution"
    category: "param_flow"
    difficulty: "hard"
    postgresql_subsystem: "executor"
    ground_truth:
      expected_functions: ["exec_bind_message", "ParamListInfo", "ExecEvalParam"]
      key_patterns: ["param", "Param", "bind"]
      required_keywords: ["parameter", "bind", "prepared", "statement"]
      min_expected_count: 3

  - id: "DF_EN_028"
    question: "Find data flows that cross privilege boundaries"
    category: "privilege_boundary"
    difficulty: "hard"
    ground_truth:
      expected_functions: ["superuser", "pg_has_role", "check_object_permission"]
      key_patterns: ["privilege", "permission", "superuser"]
      required_keywords: ["privilege", "boundary", "security"]
      min_expected_count: 2

  - id: "DF_EN_029"
    question: "Trace how error messages propagate and what data they contain"
    category: "error_data_flow"
    difficulty: "hard"
    ground_truth:
      expected_functions: ["ereport", "errdetail", "errmsg"]
      key_patterns: ["ereport", "err.*"]
      required_keywords: ["error", "message", "propagate", "data"]
      min_expected_count: 3

  - id: "DF_EN_030"
    question: "Find all sources of non-determinism that affect query results"
    category: "nondeterminism_sources"
    difficulty: "hard"
    ground_truth:
      expected_functions: ["random", "now", "current_timestamp"]
      key_patterns: ["random", "timestamp", "now"]
      required_keywords: ["nondeterminism", "random", "timestamp"]
      min_expected_count: 2
