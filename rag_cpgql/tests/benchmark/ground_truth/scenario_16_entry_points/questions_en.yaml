scenario:
  id: scenario_16_entry_points
  name: Entry Points and Attack Surface
  mapped_workflow: entry_points_workflow
  graph_methods:
  - find_entry_points
  - analyze_attack_surface
  - find_network_handlers

metadata:
  version: '2.0'
  language: en
  question_count: 15
  difficulty_distribution:
    easy: 5
    medium: 6
    hard: 4

questions:
  - id: ENT_EN_001
    question: "List network-facing functions that handle client input"
    category: network_entry
    difficulty: easy
    postgresql_subsystem: backend
    ground_truth:
      expected_functions:
        - SocketBackend
        - pq_getmsgstring
        - recv_password_packet
      key_patterns:
        - Socket
        - pq_
        - recv
        - client
      required_keywords:
        - socket
        - network
        - client
      min_expected_count: 1
    evaluation:
      metrics: [precision_at_k, recall_at_k, mrr, keyword_coverage]
      semantic_similarity_threshold: 0.7

  - id: ENT_EN_002
    question: "Find all external entry points"
    category: entry_points
    difficulty: easy
