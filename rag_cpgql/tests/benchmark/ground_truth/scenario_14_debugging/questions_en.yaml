      min_expected_count: 2

  - id: "DBG_EN_012"
    question: "Trace a specific function call chain"
    category: "call_chain"
    difficulty: "medium"
    ground_truth:
      expected_functions: ["ExecInitNode", "ExecProcNode"]
      key_patterns: ["Exec.*Node"]
      required_keywords: ["call", "chain", "trace"]
      min_expected_count: 3

  - id: "DBG_EN_013"
    question: "Find memory context debugging output"
