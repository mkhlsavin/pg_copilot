# Scenario 14: Debugging and Tracing
# Debug issues and trace execution flow

scenario:
  id: "scenario_14_debugging"
  name: "Debugging and Tracing"
  mapped_workflow: "debugging_workflow"
  graph_methods: ["execution_trace", "call_chain", "variable_watch"]

metadata:
  version: "1.0"
  language: "en"
  question_count: 30
  difficulty_distribution: {easy: 8, medium: 14, hard: 8}

questions:
  # === EASY (8) ===
  - id: "DBG_EN_001"
    question: "Find all elog debug statements in the executor"
    category: "debug_logging"
    difficulty: "easy"
    postgresql_subsystem: "executor"
    ground_truth:
      # elog is a macro that expands to ereport. Include related debug/logging functions.
      expected_functions: ["elog", "ereport", "PLy_elog", "PLy_elog_impl", "BRIN_elog"]
      key_patterns: ["elog.*DEBUG"]
      required_keywords: ["elog", "debug", "logging"]
      min_expected_count: 5

  - id: "DBG_EN_002"
    question: "Find where EXPLAIN output is generated"
    category: "explain_trace"
    difficulty: "easy"
    ground_truth:
      expected_functions: ["ExplainNode", "ExplainPrintPlan"]
      key_patterns: ["Explain"]
      required_keywords: ["EXPLAIN", "output", "plan"]
      min_expected_count: 2

  - id: "DBG_EN_003"
    question: "Find assertion macros in the codebase"
    category: "assertions"
    difficulty: "easy"
    ground_truth:
      expected_functions: []
      key_patterns: ["Assert", "AssertMacro"]
      required_keywords: ["Assert", "assertion", "check"]
      min_expected_count: 5

  - id: "DBG_EN_004"
    question: "Find performance timing instrumentation"
    category: "timing"
    difficulty: "easy"
    ground_truth:
      expected_functions: ["InstrStartNode", "InstrStopNode"]
      key_patterns: ["Instr"]
      required_keywords: ["timing", "instrument", "performance"]
      min_expected_count: 2

  - id: "DBG_EN_005"
    question: "Find pg_stat_statements integration points"
    category: "stats_trace"
    difficulty: "easy"
    ground_truth:
      expected_functions: ["pgss_store"]
      key_patterns: ["pgss", "stat_statements"]
      required_keywords: ["statistics", "statements", "tracking"]
      min_expected_count: 1

  - id: "DBG_EN_006"
    question: "Find error context callback setup"
    category: "error_context"
    difficulty: "easy"
    ground_truth:
      expected_functions: ["error_context_stack"]
      key_patterns: ["error_context"]
      required_keywords: ["error", "context", "callback"]
      min_expected_count: 2

  - id: "DBG_EN_007"
    question: "Find log_statement configuration usage"
    category: "logging"
    difficulty: "easy"
    ground_truth:
      expected_functions: []
      key_patterns: ["log_statement"]
      required_keywords: ["log", "statement", "configuration"]
      min_expected_count: 2

  - id: "DBG_EN_008"
    question: "Find trace_sort debugging output"
    category: "trace_sort"
    difficulty: "easy"
    postgresql_subsystem: "executor"
    ground_truth:
      expected_functions: []
      key_patterns: ["trace_sort"]
      required_keywords: ["trace", "sort", "debug"]
      min_expected_count: 1

  # === MEDIUM (14) ===
  - id: "DBG_EN_009"
    question: "Trace query execution from parse to result"
    category: "execution_trace"
    difficulty: "medium"
    ground_truth:
      expected_functions: ["pg_parse_query", "pg_analyze_and_rewrite", "pg_plan_queries", "ExecutorRun"]
      key_patterns: ["exec", "parse", "plan"]
      required_keywords: ["trace", "execution", "query"]
      min_expected_count: 4

  - id: "DBG_EN_010"
    question: "Find lock wait debugging information"
    category: "lock_debug"
    difficulty: "medium"
    postgresql_subsystem: "storage/lmgr"
    ground_truth:
      expected_functions: ["LockAcquire", "ProcSleep"]
      key_patterns: ["Lock.*wait", "deadlock"]
      required_keywords: ["lock", "wait", "debug"]
      min_expected_count: 2

  - id: "DBG_EN_011"
