      min_expected_count: 2

  - id: "DBG_EN_025"
    question: "Debug memory leak using context tracking"
    category: "memleak_debug"
    difficulty: "hard"
    ground_truth:
      expected_functions: ["MemoryContextStats", "MemoryContextStatsDetail"]
      key_patterns: ["MemoryContext.*track"]
      required_keywords: ["memory", "leak", "debug", "tracking"]
      min_expected_count: 2

  - id: "DBG_EN_026"
    question: "Debug corrupted data page recovery"
    category: "corruption_debug"
    difficulty: "hard"
    postgresql_subsystem: "storage/buffer"
    ground_truth:
      expected_functions: ["PageIsVerified", "PageHeaderIsValid"]
