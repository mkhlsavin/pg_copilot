# Сценарий 02: Навигация по графу вызовов
# Навигация и анализ связей между вызовами функций

scenario:
  id: "scenario_02_call_graph"
  name: "Навигация по графу вызовов"
  mapped_workflow: "security_workflow"
  graph_methods: ["CallGraphAnalyzer", "find_shortest_path", "find_all_callers", "find_all_callees"]

metadata:
  version: "1.0"
  language: "ru"
  question_count: 35
  difficulty_distribution: {easy: 10, medium: 15, hard: 10}

questions:
  # === ЛЕГКО (10) ===
  - id: "CG_RU_001"
    question: "Какие функции вызывает ExecInitNode напрямую?"
    category: "direct_callees"
    difficulty: "easy"
    postgresql_subsystem: "executor"
    target_function: "ExecInitNode"
    ground_truth:
      expected_functions: ["ExecInitResultTupleSlot", "ExecInitScanTupleSlot", "ExecInitSeqScan", "ExecInitIndexScan"]
      key_patterns: ["ExecInit.*"]
      required_keywords: ["инициализация", "исполнитель", "узел"]
      min_expected_count: 4

  - id: "CG_RU_002"
    question: "Какие функции вызывают heap_insert?"
    category: "direct_callers"
    difficulty: "easy"
    postgresql_subsystem: "storage/heap"
    target_function: "heap_insert"
    ground_truth:
      expected_functions: ["simple_heap_insert", "heapam_tuple_insert", "toast_save_datum"]
      key_patterns: [".*insert.*", "heap.*"]
      required_keywords: ["вызывающий", "вставка", "кортеж"]
      min_expected_count: 2

  - id: "CG_RU_003"
    question: "Что вызывает palloc внутри?"
    category: "direct_callees"
    difficulty: "easy"
    postgresql_subsystem: "utils/mmgr"
    target_function: "palloc"
    ground_truth:
      expected_functions: ["MemoryContextAlloc", "AllocSetAlloc"]
      key_patterns: [".*Alloc.*", "Memory.*"]
      required_keywords: ["память", "выделение", "контекст"]
      min_expected_count: 1

  - id: "CG_RU_004"
    question: "Какие функции вызывают LWLockAcquire?"
    category: "direct_callers"
    difficulty: "easy"
    postgresql_subsystem: "storage/lmgr"
    target_function: "LWLockAcquire"
    ground_truth:
      expected_functions: ["LWLockAcquireOrWait", "BufferSync"]
      key_patterns: ["LWLock.*", "Buffer.*"]
      required_keywords: ["блокировка", "захват", "буфер"]
      min_expected_count: 3

  - id: "CG_RU_005"
    question: "Какие функции вызывает ExecProcNode?"
    category: "direct_callees"
    difficulty: "easy"
    postgresql_subsystem: "executor"
    target_function: "ExecProcNode"
    ground_truth:
      expected_functions: ["ExecSeqScan", "ExecIndexScan", "ExecNestLoop"]
      key_patterns: ["Exec[A-Z].*"]
      required_keywords: ["выполнение", "узел", "сканирование"]
      min_expected_count: 3

  - id: "CG_RU_006"
    question: "Какие функции вызывают ereport?"
    category: "direct_callers"
    difficulty: "easy"
    postgresql_subsystem: "utils/elog"
    target_function: "ereport"
    ground_truth:
      expected_functions: []
      key_patterns: ["ereport", "ERROR", "WARNING"]
      required_keywords: ["ошибка", "сообщение", "много"]
      min_expected_count: 10

  - id: "CG_RU_007"
    question: "Какие функции вызывает hash_search?"
    category: "direct_callees"
    difficulty: "easy"
    postgresql_subsystem: "utils/hash"
    target_function: "hash_search"
    ground_truth:
      expected_functions: ["hash_search_with_hash_value"]
      key_patterns: ["hash.*"]
      required_keywords: ["хэш", "поиск", "таблица"]
      min_expected_count: 1

  - id: "CG_RU_008"
    question: "Какие функции вызывают SPI_execute?"
    category: "direct_callers"
    difficulty: "easy"
    postgresql_subsystem: "executor/spi"
    target_function: "SPI_execute"
    ground_truth:
      expected_functions: ["SPI_exec"]
      key_patterns: ["SPI_.*"]
      required_keywords: ["SPI", "выполнение", "запрос"]
      min_expected_count: 2

  - id: "CG_RU_009"
    question: "Что вызывает index_open?"
    category: "direct_callees"
    difficulty: "easy"
    postgresql_subsystem: "access/index"
    target_function: "index_open"
    ground_truth:
      expected_functions: ["relation_open", "LockRelationOid"]
      key_patterns: ["relation.*", "Lock.*"]
      required_keywords: ["отношение", "открыть", "блокировка"]
      min_expected_count: 1

  - id: "CG_RU_010"
    question: "Какие функции вызывают StartTransaction?"
    category: "direct_callers"
    difficulty: "easy"
    postgresql_subsystem: "access/transam"
    target_function: "StartTransaction"
    ground_truth:
      expected_functions: ["StartTransactionCommand"]
      key_patterns: [".*Transaction.*"]
      required_keywords: ["транзакция", "начало"]
      min_expected_count: 1

  # === СРЕДНЕ (15) ===
  - id: "CG_RU_011"
    question: "Найдите всех вызывающих heap_insert на глубину до 3"
    category: "multi_level_callers"
    difficulty: "medium"
    postgresql_subsystem: "storage/heap"
    target_function: "heap_insert"
    ground_truth:
      expected_functions: ["simple_heap_insert", "heapam_tuple_insert", "ExecInsert"]
      key_patterns: [".*insert.*", "Exec.*"]
      required_keywords: ["вызывающий", "цепочка", "вставка"]
      min_expected_count: 5

  - id: "CG_RU_012"
    question: "Какова цепочка вызовов от main до heap_insert?"
    category: "call_path"
    difficulty: "medium"
    postgresql_subsystem: "storage/heap"
    ground_truth:
      expected_functions: ["main", "PostmasterMain", "ServerLoop", "BackendRun"]
      key_patterns: ["main", "Postmaster", "Backend"]
      required_keywords: ["путь", "main", "вставка"]
      min_expected_count: 4

  - id: "CG_RU_013"
    question: "Найдите все функции, вызываемые ExecSeqScan транзитивно"
    category: "transitive_callees"
    difficulty: "medium"
    postgresql_subsystem: "executor"
    target_function: "ExecSeqScan"
    ground_truth:
      expected_functions: ["heap_getnext", "ExecScanFetch", "ExecProject"]
      key_patterns: ["heap_.*", "Exec.*"]
      required_keywords: ["сканирование", "выборка", "кортеж"]
      min_expected_count: 5

  - id: "CG_RU_014"
    question: "Найдите функции с наибольшим PageRank в модуле executor"
    category: "pagerank_analysis"
    difficulty: "medium"
    postgresql_subsystem: "executor"
    ground_truth:
      expected_functions: ["ExecProcNode", "ExecInitNode", "ExecEndNode"]
      key_patterns: ["Exec.*"]
      required_keywords: ["PageRank", "центральный", "важный"]
      min_expected_count: 3

  - id: "CG_RU_015"
    question: "Какие функции исполнителя вызывают функции выделения памяти?"
    category: "cross_module_calls"
    difficulty: "medium"
    ground_truth:
      expected_functions: ["ExecInitNode", "ExecProject", "ExecEvalExpr"]
      key_patterns: ["Exec.*", "palloc", "Memory"]
      required_keywords: ["исполнитель", "память", "выделение"]
      min_expected_count: 4

  - id: "CG_RU_016"
    question: "Найдите граф вызовов между модулями parser и executor"
    category: "module_interaction"
    difficulty: "medium"
    ground_truth:
      expected_functions: ["pg_parse_query", "raw_parser", "standard_ExecutorRun"]
      key_patterns: ["parse.*", "Exec.*"]
      required_keywords: ["парсер", "исполнитель", "взаимодействие"]
      min_expected_count: 3

  - id: "CG_RU_017"
    question: "Какие функции вызываются всеми типами сканирования (SeqScan, IndexScan и т.д.)?"
    category: "common_callees"
    difficulty: "medium"
    postgresql_subsystem: "executor"
    ground_truth:
      expected_functions: ["ExecScanFetch", "ExecProject", "ExecQual"]
      key_patterns: ["ExecScan.*", "ExecProject", "ExecQual"]
      required_keywords: ["сканирование", "общий", "разделяемый"]
      min_expected_count: 2

  - id: "CG_RU_018"
    question: "Найдите все функции WAL, вызываемые во время heap_insert"
    category: "filtered_callees"
    difficulty: "medium"
    postgresql_subsystem: "storage/heap"
    target_function: "heap_insert"
    ground_truth:
      expected_functions: ["XLogInsert", "XLogBeginInsert", "XLogRegisterData"]
      key_patterns: ["XLog.*", "WAL"]
      required_keywords: ["WAL", "xlog", "вставка"]
      min_expected_count: 2

  - id: "CG_RU_019"
    question: "Какие функции вызывают и LWLockAcquire и LWLockRelease?"
    category: "multi_callee_filter"
    difficulty: "medium"
    postgresql_subsystem: "storage/lmgr"
    ground_truth:
      expected_functions: ["BufferSync", "ProcArrayEndTransaction"]
      key_patterns: ["Buffer.*", "Proc.*"]
      required_keywords: ["блокировка", "захват", "освобождение", "оба"]
      min_expected_count: 3

  - id: "CG_RU_020"
    question: "Найдите кратчайший путь от PostgresMain до heap_delete"
    category: "shortest_path"
    difficulty: "medium"
    ground_truth:
      expected_functions: ["PostgresMain", "exec_simple_query", "ExecDelete"]
      key_patterns: ["Postgres.*", "exec.*", "Exec.*", "heap_delete"]
      required_keywords: ["путь", "удаление", "выполнение"]
      min_expected_count: 4

  - id: "CG_RU_021"
    question: "Какие функции планировщика вызывают функции исполнителя?"
    category: "cross_module_calls"
    difficulty: "medium"
    ground_truth:
      expected_functions: ["standard_planner", "cost_seqscan"]
      key_patterns: ["planner", "cost_.*"]
      required_keywords: ["планировщик", "исполнитель", "стоимость"]
      min_expected_count: 2

  - id: "CG_RU_022"
    question: "Найдите всех вызывающих CommitTransaction в пределах 2 переходов"
    category: "limited_callers"
    difficulty: "medium"
    postgresql_subsystem: "access/transam"
    target_function: "CommitTransaction"
    ground_truth:
      expected_functions: ["CommitTransactionCommand", "EndTransactionBlock"]
      key_patterns: [".*Transaction.*", "Commit.*"]
      required_keywords: ["фиксация", "транзакция", "вызывающий"]
      min_expected_count: 2

  - id: "CG_RU_023"
    question: "Какие функции в модуле storage вызывают функции из модуля access?"
    category: "module_dependency"
    difficulty: "medium"
    ground_truth:
      expected_functions: ["ReadBuffer", "ReleaseBuffer"]
      key_patterns: ["Buffer.*", "heap_.*"]
      required_keywords: ["storage", "access", "буфер"]
      min_expected_count: 3

  - id: "CG_RU_024"
    question: "Найдите функции, которые вызывают и palloc и pfree"
    category: "memory_management"
    difficulty: "medium"
    ground_truth:
      expected_functions: ["ExecInitExpr", "ExecEndNode"]
      key_patterns: ["Exec.*", "palloc", "pfree"]
      required_keywords: ["память", "выделение", "освобождение"]
      min_expected_count: 5

  - id: "CG_RU_025"
    question: "Какова глубина вызовов от ExecInitNode до функций heap?"
    category: "call_depth"
    difficulty: "medium"
    target_function: "ExecInitNode"
    ground_truth:
      expected_functions: ["ExecInitSeqScan", "heap_beginscan"]
      key_patterns: ["ExecInit.*", "heap_.*"]
      required_keywords: ["глубина", "heap", "инициализация"]
      min_expected_count: 2

  # === СЛОЖНО (10) ===
  - id: "CG_RU_026"
    question: "Найдите кратчайший путь от main до CheckTableNotInUse"
    category: "long_path"
    difficulty: "hard"
    ground_truth:
      expected_functions: ["main", "PostmasterMain", "ServerLoop", "ProcessUtility"]
      key_patterns: ["main", "Postmaster", "Process.*"]
      required_keywords: ["путь", "main", "проверка", "таблица"]
      min_expected_count: 5

  - id: "CG_RU_027"
    question: "Найдите все рекурсивные циклы функций в модуле planner"
    category: "cycle_detection"
    difficulty: "hard"
    postgresql_subsystem: "optimizer"
    ground_truth:
      expected_functions: ["set_plan_refs", "recurse_set_operations"]
      key_patterns: ["set_.*", "recurse.*"]
      required_keywords: ["рекурсивный", "цикл", "планировщик"]
      min_expected_count: 2

  - id: "CG_RU_028"
    question: "Какие функции имеют наибольшую betweenness centrality в графе вызовов?"
    category: "centrality_analysis"
    difficulty: "hard"
    ground_truth:
      expected_functions: ["ExecProcNode", "palloc", "ereport"]
      key_patterns: ["Exec.*", "palloc", "ereport"]
      required_keywords: ["betweenness", "центральность", "узкое место"]
      min_expected_count: 5

  - id: "CG_RU_029"
    question: "Найдите сильно связные компоненты в графе вызовов executor"
    category: "scc_analysis"
    difficulty: "hard"
    postgresql_subsystem: "executor"
    ground_truth:
      expected_functions: ["ExecProcNode", "ExecSeqScan", "ExecNestLoop"]
      key_patterns: ["Exec.*"]
      required_keywords: ["SCC", "сильно", "связный", "компонент"]
      min_expected_count: 3

  - id: "CG_RU_030"
    question: "Найдите все функции, достижимые из main, но не из PostgresMain"
    category: "reachability_diff"
    difficulty: "hard"
    ground_truth:
      expected_functions: ["PostmasterMain", "PgArchiverMain"]
      key_patterns: [".*Main"]
      required_keywords: ["достижимый", "main", "исключительно"]
      min_expected_count: 3

  - id: "CG_RU_031"
    question: "Найдите потенциальные паттерны deadlock через цепочки захвата блокировок"
    category: "deadlock_analysis"
    difficulty: "hard"
    postgresql_subsystem: "storage/lmgr"
    ground_truth:
      expected_functions: ["LWLockAcquire", "LockAcquire", "ProcSleep"]
      key_patterns: ["Lock.*", "LWLock.*"]
      required_keywords: ["deadlock", "блокировка", "цепочка", "захват"]
      min_expected_count: 3

  - id: "CG_RU_032"
    question: "Постройте полный поток вызовов от парсинга запроса до возврата результата"
    category: "e2e_flow"
    difficulty: "hard"
    ground_truth:
      expected_functions: ["pg_parse_query", "pg_analyze_and_rewrite", "pg_plan_queries", "PortalRun"]
      key_patterns: ["pg_.*", "Portal.*"]
      required_keywords: ["запрос", "парсинг", "план", "выполнение", "поток"]
      min_expected_count: 4

  - id: "CG_RU_033"
    question: "Найдите все пути обработки ошибок из ExecProcNode"
    category: "error_paths"
    difficulty: "hard"
    target_function: "ExecProcNode"
    ground_truth:
      expected_functions: ["ereport", "elog", "ExceptionalCondition"]
      key_patterns: ["ereport", "elog", "error"]
      required_keywords: ["ошибка", "обработка", "исключение"]
      min_expected_count: 3

  - id: "CG_RU_034"
    question: "Найдите функции критического пути в фиксации транзакции"
    category: "critical_path"
    difficulty: "hard"
    postgresql_subsystem: "access/transam"
    ground_truth:
      expected_functions: ["CommitTransaction", "RecordTransactionCommit", "XLogFlush"]
      key_patterns: ["Commit.*", "XLog.*"]
      required_keywords: ["фиксация", "критический", "путь", "транзакция"]
      min_expected_count: 3

  - id: "CG_RU_035"
    question: "Определите слабо связные компоненты в графе вызовов buffer manager"
    category: "wcc_analysis"
    difficulty: "hard"
    postgresql_subsystem: "storage/buffer"
    ground_truth:
      expected_functions: ["BufferSync", "ReadBuffer", "FlushBuffer"]
      key_patterns: ["Buffer.*", "Flush.*"]
      required_keywords: ["WCC", "слабо", "связный", "буфер"]
      min_expected_count: 3
