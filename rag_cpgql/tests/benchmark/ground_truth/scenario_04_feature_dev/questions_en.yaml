scenario:
  id: scenario_04_feature_dev
  name: Feature Development
  mapped_workflow: feature_dev_workflow
  graph_methods:
  - find_extension_points
  - find_hooks
  - find_plugin_interfaces

metadata:
  version: '2.1'
  language: en
  question_count: 10
  difficulty_distribution:
    easy: 4
    medium: 4
    hard: 2

questions:
  - id: FEAT_EN_001
    question: "Where should I add a new join algorithm?"
    category: extension_points
    difficulty: medium
    postgresql_subsystem: optimizer
    ground_truth:
      expected_functions:
        - add_path
        - create_hashjoin_path
        - create_mergejoin_path
        - create_mergejoin_plan
        - create_hashjoin_plan
        - create_nestloop_path
      key_patterns:
        - join
        - path
        - optimizer
        - add_path
      required_keywords:
        - join
        - path
      min_expected_count: 1
    evaluation:
      metrics: [precision_at_k, recall_at_k, mrr, keyword_coverage]
      semantic_similarity_threshold: 0.7

  - id: FEAT_EN_002
    question: "Find extension hooks in the executor"
    category: hooks
    difficulty: easy
    postgresql_subsystem: executor
    ground_truth:
      expected_functions:
        # Actual functions that invoke hooks
        - ExecutorStart
        - ExecutorRun
        - ExecutorEnd
        - ExecutorFinish
        - ExecutorRewind
        # Hook variable names (may not be in CPG as functions)
        - ExecutorStart_hook
        - ExecutorRun_hook
        - ExecutorEnd_hook
      key_patterns:
        - hook
        - Executor
        - _hook
      required_keywords:
        - hook
        - executor
      min_expected_count: 1
    evaluation:
      metrics: [precision_at_k, recall_at_k, mrr, keyword_coverage]
      semantic_similarity_threshold: 0.7

  - id: FEAT_EN_003
    question: "Where can I add custom plan nodes?"
    category: extension_points
    difficulty: medium
    postgresql_subsystem: executor
    ground_truth:
      expected_functions:
        - ExecProcNode
        - ExecInitNode
        - ExecEndNode
        - ExecInitCustomScan
        - ExecCustomScan
        - ExecEndCustomScan
      key_patterns:
        - Custom
        - Node
        - ExecInit
        - Plan
      required_keywords:
        - node
        - custom
      min_expected_count: 1
    evaluation:
      metrics: [precision_at_k, recall_at_k, mrr, keyword_coverage]
      semantic_similarity_threshold: 0.7

  - id: FEAT_EN_004
    question: "Find planner hook injection points"
    category: hooks
    difficulty: easy
    postgresql_subsystem: planner
    ground_truth:
      expected_functions:
        # Actual planner functions
        - planner
        - standard_planner
        - subquery_planner
        - set_rel_pathlist
        - create_upper_paths
        # Hook variable names
        - planner_hook
        - set_rel_pathlist_hook
        - create_upper_paths_hook
      key_patterns:
        - planner
        - hook
        - pathlist
      required_keywords:
        - planner
        - hook
      min_expected_count: 1
    evaluation:
      metrics: [precision_at_k, recall_at_k, mrr, keyword_coverage]
      semantic_similarity_threshold: 0.7

  - id: FEAT_EN_005
    question: "Where to implement a new aggregate function?"
    category: extension_points
    difficulty: easy
    postgresql_subsystem: executor
    ground_truth:
      expected_functions:
        - ExecInitAgg
        - advance_aggregates
