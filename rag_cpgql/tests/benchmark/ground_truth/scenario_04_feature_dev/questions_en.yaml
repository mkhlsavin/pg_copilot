  - id: FEAT_EN_007
    question: "Where to add custom table access methods?"
    category: extension_points
    difficulty: hard
    postgresql_subsystem: storage
    ground_truth:
      expected_functions:
        # Functions that actually exist in CPG
        - GetTableAmRoutine
        - table_beginscan
        - table_beginscan_catalog
        - table_beginscan_sampling
        - table_scan_sample_next_block
        - table_scan_sample_next_tuple
        - table_rescan_set_params
        - get_table_am_oid
        - table_relation_toast_am
