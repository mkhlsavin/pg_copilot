      required_keywords:
        - aggregate
        - function
      min_expected_count: 1
    evaluation:
      metrics: [precision_at_k, recall_at_k, mrr, keyword_coverage]
      semantic_similarity_threshold: 0.7

  - id: FEAT_EN_006
    question: "Find process utility hooks for DDL extension"
    category: hooks
    difficulty: medium
    postgresql_subsystem: commands
    ground_truth:
      expected_functions:
