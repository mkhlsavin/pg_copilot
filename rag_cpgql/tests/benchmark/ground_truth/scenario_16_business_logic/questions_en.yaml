# Scenario 16: Business Logic Understanding
# Understand high-level business logic and data flows

scenario:
  id: "scenario_16_business_logic"
  name: "Business Logic Understanding"
  mapped_workflow: "onboarding_workflow"
  graph_methods: ["semantic_analysis", "pattern_recognition", "domain_modeling"]

metadata:
  version: "1.0"
  language: "en"
  question_count: 30
  difficulty_distribution: {easy: 10, medium: 12, hard: 8}

questions:
  # === EASY (10) ===
  - id: "BL_EN_001"
    question: "What happens when a SELECT query is executed?"
    category: "query_flow"
    difficulty: "easy"
    ground_truth:
      expected_functions: ["pg_parse_query", "pg_analyze_and_rewrite", "pg_plan_queries", "ExecutorRun"]
      key_patterns: ["SELECT", "query"]
      required_keywords: ["SELECT", "query", "execute", "result"]
      min_expected_count: 3

  - id: "BL_EN_002"
    question: "How does INSERT work internally?"
    category: "dml_flow"
    difficulty: "easy"
    ground_truth:
