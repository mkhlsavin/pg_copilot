# PostgreSQL Security Vulnerability Patterns
# Patterns for detecting security issues specific to PostgreSQL codebase

patterns:
  - id: sql_injection
    name: "SQL Injection"
    description: "Dynamic SQL construction without proper parameterization"
    severity: critical
    cwe_id: "CWE-89"
    indicators:
      - "StringInfo.*appendStringInfo.*%s"
      - "psprintf.*user_input"
      - "format.*%s.*query"
    sinks:
      - SPI_execute
      - SPI_exec
      - SPI_execute_with_args
      - SPI_execp
      - SPI_execute_extended
      - exec_simple_query
    sources:
      - PG_GETARG_TEXT_PP
      - PG_GETARG_CSTRING
      - pq_getmsgstring
      - pq_getmsgbytes
    sanitizers:
      - quote_identifier
      - quote_literal
      - quote_literal_cstr
      - TextDatumGetCString

  - id: buffer_overflow
    name: "Buffer Overflow"
    description: "Unsafe memory operations that may overflow buffers"
    severity: critical
    cwe_id: "CWE-120"
    indicators:
      - strcpy
      - strcat
      - sprintf
      - gets
      - scanf
    sinks:
      - memcpy
      - memmove
      - strcpy
      - strcat
    sources:
      - user_input
      - network_data
    sanitizers:
      - strlcpy
      - strlcat
      - snprintf
      - pg_strndup

  - id: integer_overflow
    name: "Integer Overflow"
    description: "Arithmetic operations that may overflow"
    severity: high
    cwe_id: "CWE-190"
    indicators:
      - "size_t.*\\*"
      - "int.*\\+.*size"
      - "palloc.*\\*"
    sinks:
      - palloc
      - repalloc
      - MemoryContextAlloc
    sources:
      - PG_GETARG_INT32
      - PG_GETARG_INT64
    sanitizers:
      - pg_add_s32_overflow
      - pg_mul_s32_overflow

  - id: use_after_free
    name: "Use After Free"
    description: "Memory accessed after being freed"
    severity: critical
    cwe_id: "CWE-416"
    indicators:
      - "pfree.*return"
      - "MemoryContextDelete.*access"
    sinks:
      - pfree
      - MemoryContextDelete
      - MemoryContextReset
    sources: []
    sanitizers: []

  - id: null_pointer_deref
    name: "NULL Pointer Dereference"
    description: "Dereferencing potentially NULL pointers"
    severity: high
    cwe_id: "CWE-476"
    indicators:
      - "->.*without.*NULL.*check"
    sinks:
      - pointer_dereference
    sources:
      - palloc
      - SearchSysCache
      - relation_open
    sanitizers:
      - Assert
      - if.*NULL
      - elog.*ERROR

  - id: privilege_escalation
    name: "Privilege Escalation"
    description: "Unauthorized elevation of privileges"
    severity: critical
    cwe_id: "CWE-269"
    indicators:
      - superuser
      - has_privs_of_role
      - pg_has_role
      - check_is_member_of_role
    sinks:
      - SetUserId
      - SetSecurityContext
    sources:
      - GetUserId
      - GetSessionUserId
    sanitizers:
      - has_privs_of_role
      - pg_class_aclcheck
      - object_aclcheck

  - id: path_traversal
    name: "Path Traversal"
    description: "Unvalidated file path allowing directory traversal"
    severity: high
    cwe_id: "CWE-22"
    indicators:
      - "../"
      - "..%2f"
      - file_path
    sinks:
      - PathNameOpenFile
      - AllocateFile
      - fopen
      - pg_read_file
      - pg_ls_dir
    sources:
      - PG_GETARG_TEXT_PP
      - user_supplied_path
    sanitizers:
      - is_absolute_path
      - path_is_prefix_of_path

  - id: command_injection
    name: "Command Injection"
    description: "Shell command injection through unvalidated input"
    severity: critical
    cwe_id: "CWE-78"
    indicators:
      - system
      - popen
      - exec
      - shell
    sinks:
      - system
      - popen
      - exec_command
    sources:
      - user_input
      - PG_GETARG_TEXT_PP
    sanitizers:
      - shell_quote
      - quote_literal

  - id: information_disclosure
    name: "Information Disclosure"
    description: "Sensitive information exposed in error messages or logs"
    severity: medium
    cwe_id: "CWE-200"
    indicators:
      - ereport.*password
      - elog.*credential
      - error.*secret
    sinks:
      - ereport
      - elog
      - errdetail
      - errmsg
    sources:
      - password
      - credential
      - secret
      - key
    sanitizers:
      - errhint
      - errcode

  - id: toctou
    name: "Time-of-Check Time-of-Use"
    description: "Race condition between security check and resource use"
    severity: high
    cwe_id: "CWE-367"
    indicators:
      - access.*fopen
      - stat.*open
      - check.*use
    sinks:
      - file_operation
      - resource_access
    sources:
      - check_function
      - access
      - stat
    sanitizers:
      - flock
      - LWLockAcquire
