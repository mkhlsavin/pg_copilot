# =============================================================================
# Code Review Configuration
# =============================================================================
#
# Configuration for the automated patch-based code review system.
#
# Sections:
#   dod          - Definition of Done settings
#   policy       - Review policy and thresholds
#   analyzers    - Impact analyzer settings
#   verdicts     - Verdict generator weights
#   output       - Output format settings
#
# Environment Variables:
#   JIRA_URL        - Jira server URL for DoD extraction
#   JIRA_API_KEY    - Jira API authentication key
#   GITHUB_TOKEN    - GitHub API token for PR access
#   GITLAB_TOKEN    - GitLab API token for MR access
#
# =============================================================================

# Definition of Done Configuration
dod:
  # Sources for DoD extraction (in order of priority)
  # Available: pr_body, jira, commit_message, manual
  sources:
    - pr_body
    - jira
    - commit_message
    - manual

  # Priority order for source selection (first found wins)
  source_priority:
    - pr_body
    - jira
    - commit_message

  # Supported DoD formats for parsing
  # Available: checklist, yaml, markdown, json
  formats:
    - checklist
    - yaml
    - markdown
    - json

  # Auto-generate DoD if not found in any source
  auto_generate: true

  # Interactive mode: ask user to confirm/modify DoD
  interactive_confirm: false

  # Jira integration settings
  jira:
    url: ${JIRA_URL}
    api_key: ${JIRA_API_KEY}
    # Custom field ID for DoD in Jira
    dod_field: "customfield_10001"
    # Alternative: use Acceptance Criteria field
    # dod_field: "customfield_10002"

  # DoD generation settings (when auto_generate=true)
  generation:
    # Use LLM for generation (requires LLM provider configured)
    use_llm: true
    # Fall back to rule-based generation if LLM fails
    fallback_to_rules: true
    # Include security items based on changed files
    include_security: true
    # Include performance items based on changes
    include_performance: true
    # Always include test requirement
    require_tests: true

  # Validation settings
  validation:
    # Strict mode: fail on any finding (not just critical/high)
    strict_mode: false
    # Severities that block DoD items
    blocking_severities:
      - critical
      - high

# Review Policy Configuration
policy:
  # Blocking criteria (will result in BLOCK recommendation)
  block_on_critical_security: true
  block_on_high_security: false
  block_on_critical_errors: true
  block_on_breaking_changes: false

  # Score thresholds (0-100)
  min_score_to_approve: 70.0
  min_score_to_comment: 60.0

  # Finding limits
  max_critical_findings: 0     # 0 = block on any critical
  max_high_findings: 5
  max_complexity_increase: 20

  # DoD compliance requirements
  require_dod_compliance: false  # Block if DoD not fully satisfied
  min_dod_compliance_score: 60.0

  # Custom rules (advanced)
  custom_rules: []
  # Example custom rule:
  # - rule_id: "no_sql_in_controllers"
  #   name: "No SQL in controllers"
  #   condition: "has_sql_in_controller"
  #   action: "block"
  #   message: "SQL queries should be in repository layer"

# Analyzer Configuration
analyzers:
  call_graph:
    enabled: true
    # Maximum traversal depth for blast radius
    max_depth: 5
    # Include indirect callers in impact
    include_indirect: true

  dataflow:
    enabled: true
    # Maximum taint path length
    max_path_length: 10
    # Minimum sanitization confidence
    sanitization_threshold: 0.7

  control_flow:
    enabled: true
    # Complexity threshold for warnings
    complexity_threshold: 10
    # Maximum nesting depth
    max_nesting_depth: 5

  dependency:
    enabled: true
    # Detect circular dependencies
    check_circular: true
    # Maximum allowed coupling increase
    max_coupling_increase: 0.2

# Verdict Generator Weights
verdicts:
  # Weight distribution for final score (must sum to 1.0)
  weights:
    security: 0.35
    performance: 0.20
    error: 0.25
    architecture: 0.20

  # DoD compliance weight (applied separately)
  dod_compliance_weight: 0.10

  # Thresholds for recommendation
  thresholds:
    block: 40       # Score below this = BLOCK
    request_changes: 60  # Score below this = REQUEST_CHANGES
    comment: 80     # Score below this = COMMENT
    approve: 80     # Score >= this = APPROVE

# Output Configuration
output:
  # Output formats to generate
  formats:
    - json
    - markdown
    - pr_comment

  # Include DoD validation in output
  include_dod: true

  # Include detailed findings
  include_findings: true

  # Include code snippets in findings
  include_snippets: true

  # Maximum findings per category to include
  max_findings_per_category: 10

  # GitHub/GitLab PR comment settings
  pr_comment:
    # Maximum comment length (GitHub limit is ~65535)
    max_length: 10000
    # Include emoji indicators
    use_emoji: true
    # Collapse long sections
    collapsible_sections: true
