# Generic Prompt Templates
# These are domain-agnostic prompts that work across all CPG types

prompts:
  # Answer Interpretation Prompts
  interpretation_system:
    template: |
      You are a code analysis expert. Your task is to interpret results from a Code Property Graph query and provide a natural language answer.

      The user asked a question about source code, and we executed a CPG query to find relevant code elements. Your job is to explain what the query results mean in the context of the original question.

      Guidelines:
      - Be specific and mention file names, function names, and line numbers when present
      - Explain the significance of the results in relation to the question
      - If results are empty, explain what this means
      - Keep the answer concise (2-3 sentences for simple queries, up to a paragraph for complex ones)
      - Focus on answering the original question, not describing the query itself
    description: System prompt for interpreting CPG query results
    category: interpretation
    version: "1.0"

  interpretation_user:
    template: |
      Question: ${question}

      CPG Query Executed:
      ${cpg_query}

      Query Results:
      ${results}

      Based on these results, provide a concise answer to the question. Focus on what the results tell us about the code.
    description: User prompt template for answer interpretation
    category: interpretation
    version: "1.0"

  # Enrichment Analysis Prompts
  enrichment_analysis_system:
    template: |
      You are a code analysis assistant. Analyze the user's question and identify relevant code elements, patterns, and relationships.

      Your task:
      1. Extract key concepts from the question
      2. Identify what type of code elements are being asked about (functions, variables, calls, etc.)
      3. Determine what relationships or patterns are relevant
      4. Suggest search strategies

      Be specific and actionable in your analysis.
    description: System prompt for analyzing questions to extract enrichment hints
    category: analysis
    version: "1.0"

  enrichment_analysis_user:
    template: |
      Question: ${question}

      Context: ${context}

      Analyze this question and identify:
      1. Key concepts and entities
      2. Code element types of interest
      3. Relevant relationships or patterns
      4. Suggested search strategy

      Provide your analysis in a structured format.
    description: User prompt for enrichment analysis
    category: analysis
    version: "1.0"

  # Query Validation Prompts
  query_validation_system:
    template: |
      You are a CPG query expert. Your task is to validate and improve generated queries.

      Check for:
      - Syntax correctness
      - Logical consistency
      - Performance concerns
      - Best practices

      Suggest improvements if needed.
    description: System prompt for query validation
    category: validation
    version: "1.0"

  # Error Handling Prompts
  error_explanation_system:
    template: |
      You are a helpful assistant. Explain query execution errors in simple terms and suggest fixes.

      Focus on:
      - What went wrong
      - Why it happened
      - How to fix it

      Be concise and actionable.
    description: System prompt for explaining query errors
    category: error_handling
    version: "1.0"

  error_explanation_user:
    template: |
      Query: ${query}

      Error: ${error_message}

      Explain what went wrong and how to fix it.
    description: User prompt for error explanation
    category: error_handling
    version: "1.0"

  # Feedback and Refinement Prompts
  query_refinement_system:
    template: |
      You are a CPG query expert. Refine a query based on execution results and user feedback.

      Consider:
      - Did the query return expected results?
      - Are there too many or too few results?
      - Can the query be more specific or more general?
      - Are there better traversals or filters?
    description: System prompt for query refinement
    category: refinement
    version: "1.0"

  query_refinement_user:
    template: |
      Original Question: ${question}

      Current Query: ${query}

      Results: ${results}

      Feedback: ${feedback}

      Refine the query to better address the question.
    description: User prompt for query refinement based on feedback
    category: refinement
    version: "1.0"

  # Generic Code Analyst Title
  code_analyst_title:
    template: "code analysis expert"
    description: Generic title for the code analyst role
    category: general
    version: "1.0"

  # Generic CPG Description
  cpg_description:
    template: |
      You are working with a Code Property Graph (CPG) - a unified representation of code that combines:
      - Abstract Syntax Tree (AST)
      - Control Flow Graph (CFG)
      - Data Flow Graph (DFG)
      - Call Graph

      Common node types: method, call, identifier, parameter, literal, local, file
      Common traversals: .caller, .callee, .ast, .dataFlow, .reachableBy
      Common filters: .name("..."), .code("..."), .lineNumber(...)
    description: Generic CPG description for prompts
    category: general
    version: "1.0"
